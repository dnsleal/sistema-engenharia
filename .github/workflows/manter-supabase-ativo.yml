# O plano gratuito do Supabase pausa o projeto depois de ~7 dias sem uso.
# Este agendamento faz uma consulta leve a cada 3 dias para mantê-lo ativo.
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 11 */3 * *'   # 08:17 em Cuiabá, a cada 3 dias
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta ao banco
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" comum/config.js)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" comum/config.js)
          for t in obras processos laudos; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/$t?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "$t -> HTTP $code"
          done
