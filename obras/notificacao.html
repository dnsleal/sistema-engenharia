<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notificação</title>
<style>
  @page { size: A4 portrait; margin: 18mm 18mm 16mm; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9edf2; color: #111; font-family: Arial, Helvetica, sans-serif; font-size: 11.5pt; line-height: 1.45; }
  .ferramentas { position: sticky; top: 0; z-index: 2; background: #1f3864; color: #fff; padding: 10px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font: 13px "Segoe UI", Arial, sans-serif; }
  .ferramentas button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid #fff; background: #fff; color: #1f3864; cursor: pointer; }
  .ferramentas a { color: #dbe4f5; margin-left: auto; }
  .folha { width: 210mm; min-height: 297mm; margin: 16px auto; background: #fff; padding: 18mm; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .cab { text-align: center; border-bottom: 2px solid #1f3864; padding-bottom: 8px; margin-bottom: 14px; }
  .cab .org { font-weight: 700; text-transform: uppercase; font-size: 11pt; }
  .cab h1 { margin: 10px 0 0; font-size: 15pt; color: #1f3864; letter-spacing: .5px; }
  .cab .data { font-size: 10pt; color: #444; }
  table.id { width: 100%; border-collapse: collapse; font-size: 10pt; margin-bottom: 14px; }
  table.id td { border: 1px solid #9aa6b8; padding: 4px 7px; vertical-align: top; }
  table.id td.r { width: 26%; background: #eef2f8; font-weight: 700; }
  h2 { font-size: 11.5pt; color: #1f3864; margin: 16px 0 4px; text-transform: uppercase; break-after: avoid; }
  p { margin: 0 0 8px; text-align: justify; white-space: pre-wrap; }
  .prazo { border: 1.5px solid #1f3864; background: #f3f6fb; padding: 8px 10px; margin: 6px 0 8px; }
  .assin { margin-top: 34px; text-align: center; break-inside: avoid; }
  .assin .linha { width: 70%; margin: 0 auto; border-top: 1px solid #222; padding-top: 4px; font-weight: 700; }
  .receb { margin-top: 30px; border: 1px solid #9aa6b8; padding: 10px 12px; font-size: 10pt; break-inside: avoid; }
  .receb .campos { display: grid; grid-template-columns: 2fr 1fr; gap: 26px 20px; margin-top: 26px; }
  .receb .campos div { border-top: 1px solid #222; padding-top: 3px; }
  .rod { margin-top: 18px; font-size: 8.5pt; color: #666; text-align: right; }
  [contenteditable]:hover, [contenteditable]:focus { outline: 1px dashed #8aa4d6; }
  .msg { padding: 40px; text-align: center; font-family: Arial; }
  @media print {
    body { background: #fff; }
    .ferramentas { display: none; }
    .folha { width: auto; min-height: 0; margin: 0; padding: 0; box-shadow: none; }
    [contenteditable] { outline: none !important; }
  }
</style>
</head>
<body>
<div class="ferramentas">
  <button id="bImprimir" onclick="window.print()">Imprimir / salvar em PDF</button>
  <span style="opacity:.85">Qualquer texto pode ser ajustado clicando sobre ele antes de imprimir (não altera o que está salvo).</span>
  <a id="lVoltar" href="#">← Voltar às notificações</a>
</div>
<div id="doc"><div class="msg">Carregando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../comum/config.js"></script>
<script src="../comum/supabase.js"></script>
<script src="../comum/formatos.js"></script>
<script src="../comum/drive.js"></script>
<script>
const { sb } = SE;
const id = new URLSearchParams(location.search).get('id');
const E = s => F.esc(s || '');
const extenso = d => d ? new Date(d + 'T12:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';

(async function () {
  const u = await SE.exigirLogin(); if (!u) return;
  const { data: n, error } = await sb.from('notificacoes').select('*, obras(*), processos(numero)').eq('id', id).single();
  if (error || !n) { document.getElementById('doc').innerHTML = '<div class="msg">Notificação não encontrada.</div>'; return; }
  const o = n.obras || {};
  document.getElementById('lVoltar').href = `notificacoes.html?obra=${n.obra_id}&id=${n.id}`;
  document.title = `Notificação ${n.numero || ''} - ${o.nome}`.replace(/\//g, '-');
  document.body.dataset.obra = o.nome || '';
  const processo = (n.processos && n.processos.numero) || o.processo_siged;
  const prazoTxt = n.prazo_dias != null
    ? `Fica a CONTRATADA notificada a cumprir o determinado acima no prazo de <b>${n.prazo_dias} (${porExtenso(n.prazo_dias)}) dias ${n.contagem === 'uteis' ? 'úteis' : 'corridos'}</b>, contados do recebimento desta notificação${n.prazo && n.data_ciencia ? `, encerrando-se em <b>${F.data(n.prazo)}</b>` : ''}, devendo apresentar resposta formal à fiscalização, por escrito, com as providências adotadas e a respectiva comprovação.`
    : 'Fica a CONTRATADA notificada a cumprir o determinado acima e a apresentar resposta formal à fiscalização, por escrito, com as providências adotadas e a respectiva comprovação.';
  document.getElementById('doc').innerHTML = `<div class="folha" contenteditable="true" spellcheck="false">
    <div class="cab">
      <div class="org">${E(o.contratante) || 'Contratante'}</div>
      <div>Fiscalização do contrato</div>
      <h1>NOTIFICAÇÃO Nº ${E(n.numero) || '___/____'}</h1>
      ${n.categoria ? `<div class="data">${E(n.categoria)}</div>` : ''}
    </div>
    <table class="id">
      <tr><td class="r">Contratada</td><td>${E(o.contratada)}${o.cnpj_contratada ? ' — CNPJ ' + E(o.cnpj_contratada) : ''}</td></tr>
      ${n.destinatario ? `<tr><td class="r">A/C</td><td>${E(n.destinatario)}</td></tr>` : ''}
      <tr><td class="r">Contrato</td><td>${E(o.num_contrato) || '—'}</td></tr>
      <tr><td class="r">Objeto</td><td>${E(o.objeto || o.nome)}</td></tr>
      ${o.endereco ? `<tr><td class="r">Local</td><td>${E(o.endereco)}</td></tr>` : ''}
      ${processo ? `<tr><td class="r">Processo</td><td>${E(processo)}</td></tr>` : ''}
      <tr><td class="r">Assunto</td><td><b>${E(n.assunto)}</b></td></tr>
    </table>

    <p>A FISCALIZAÇÃO do contrato acima identificado, no exercício das atribuições previstas no art. 117 da Lei nº 14.133/2021 e nas cláusulas contratuais, NOTIFICA a CONTRATADA nos seguintes termos:</p>

    <h2>1. Da constatação</h2>
    <p>${n.data_constatacao ? `Em ${F.data(n.data_constatacao)}, ` : ''}${E(n.constatacao)}</p>
    ${n.evidencia ? `<p><b>Evidências:</b> ${E(n.evidencia)}</p>` : ''}

    ${n.fundamento ? `<h2>2. Do fundamento</h2><p>A situação descrita contraria o disposto em: ${E(n.fundamento)}</p>` : ''}

    <h2>${n.fundamento ? 3 : 2}. Da determinação</h2>
    <p>${E(n.determinacao)}</p>

    <h2>${n.fundamento ? 4 : 3}. Do prazo</h2>
    <div class="prazo">${prazoTxt}</div>
    <p>O não atendimento desta notificação no prazo estabelecido será registrado e comunicado à autoridade competente, para adoção das medidas previstas no contrato e na legislação aplicável, assegurados o contraditório e a ampla defesa.</p>

    <p style="text-align:right;margin-top:18px">Cuiabá-MT, ${extenso(n.data)}.</p>

    <div class="assin">
      <div class="linha">${E(n.signatario) || 'Nome do fiscal'}</div>
      <div>${E(n.cargo) || 'Fiscal do contrato'}</div>
    </div>

    <div class="receb">
      <b>RECEBIMENTO / CIÊNCIA DA CONTRATADA</b>${n.data_ciencia ? ` — ciência em ${F.data(n.data_ciencia)}` : ''}
      <div class="campos"><div>Nome e assinatura do representante</div><div>Data</div></div>
    </div>
    <div class="rod">Desenvolvido por Eng. Civil Diego Leal — CREA-MT 37420</div>
  </div>`;
})();

Drive.botoes({ barra: '.ferramentas', antesDe: '#lVoltar', alvo: '.folha', formatos: ['pdf', 'docx'],
  pasta: () => ['Obras', document.body.dataset.obra, 'Notificações'] });

function porExtenso(n) {
  const u = ['zero', 'um', 'dois', 'três', 'quatro', 'cinco', 'seis', 'sete', 'oito', 'nove', 'dez', 'onze', 'doze', 'treze', 'quatorze', 'quinze', 'dezesseis', 'dezessete', 'dezoito', 'dezenove'];
  const d = ['', '', 'vinte', 'trinta', 'quarenta', 'cinquenta', 'sessenta', 'setenta', 'oitenta', 'noventa'];
  if (n < 20) return u[n];
  if (n < 100) return d[Math.floor(n / 10)] + (n % 10 ? ' e ' + u[n % 10] : '');
  if (n === 100) return 'cem';
  if (n < 200) return 'cento e ' + porExtenso(n - 100);
  return String(n);
}
</script>
</body>
</html>
