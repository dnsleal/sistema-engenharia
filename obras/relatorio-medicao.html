<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório da medição</title>
<style id="estiloBase">
  @page { size: A4 portrait; margin: 0; }
  body { margin: 0; background: #e9edf2; }
  .ferramentas { position: sticky; top: 0; z-index: 2; background: #1f3864; color: #fff; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font: 13px "Segoe UI", Arial, sans-serif; }
  .ferramentas button { font: inherit; font-weight: 600; padding: 7px 14px; border-radius: 6px; border: 1px solid #fff; background: #fff; color: #1f3864; cursor: pointer; }
  .ferramentas button.sec { background: transparent; color: #fff; }
  .ferramentas a { color: #dbe4f5; margin-left: auto; }
  #doc .folha { margin: 16px auto; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
  .msg { padding: 40px; text-align: center; font: 14px Arial, sans-serif; }
  @media print { body { background: #fff; } .ferramentas { display: none; } #doc .folha { margin: 0; box-shadow: none; } }
</style>
<style id="estiloDoc"></style>
</head>
<body>
<div class="ferramentas">
  <button id="bImprimir">Imprimir / salvar em PDF</button>
  <button class="sec" id="bWord">Baixar Word</button>
  <a id="lVoltar" href="#">← Voltar ao BM</a>
</div>
<div id="doc"><div class="msg">Carregando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
<script src="../comum/config.js?v=diego2"></script>
<script src="../comum/supabase.js?v=diego2"></script>
<script src="../comum/formatos.js?v=diego2"></script>
<script src="../comum/extenso.js?v=diego2"></script>
<script src="../comum/medicao.js?v=diego2"></script>
<script src="../comum/relatorios-medicao.js?v=diego2"></script>
<script src="../comum/drive.js?v=diego2"></script>
<script>
const { sb } = SE;
const $ = id => document.getElementById(id);
const P = new URLSearchParams(location.search), obraId = P.get('obra'), bmId = P.get('bm'), tipo = P.get('tipo') === 'gestor' ? 'gestor' : 'fiscal';
const TIMBRE = '../comum/img/timbre-sms-cuiaba.png';

(async function () {
  const u = await SE.exigirLogin(); if (!u) return;
  $('lVoltar').href = `medicao.html?obra=${obraId}&bm=${bmId}#${tipo === 'gestor' ? 'gestor' : 'fiscal'}`;
  $('estiloDoc').textContent = RelMedicao.CSS;
  let M;
  try { M = await Medicao.carregar(sb, obraId, bmId); }
  catch (e) { $('doc').innerHTML = `<div class="msg">Não foi possível carregar: ${F.esc(e.message)}</div>`; return; }
  const ids = [M.obra.fiscal_id, M.obra.gestor_id, M.obra.fiscal_adm_id].filter(Boolean), pessoas = {};
  if (ids.length) { const { data } = await sb.from('pessoas').select('*').in('id', ids); for (const p of data || []) pessoas[p.id] = p; }
  const c = RelMedicao.contexto(M, pessoas);
  $('doc').innerHTML = tipo === 'gestor' ? RelMedicao.htmlGestor(c, TIMBRE) : RelMedicao.htmlFiscal(c, TIMBRE);
  const n = String(M.bm.numero).padStart(2, '0');
  document.title = `${tipo === 'gestor' ? 'Relatório do Gestor' : 'Relatório de Fiscalização'} BM ${n} - ${M.obra.nome}`;
  document.body.dataset.obra = M.obra.nome;
  $('bImprimir').onclick = () => window.print();
  $('bWord').onclick = baixarWord;
  window.__pronto = true;
  Drive.botoes({ barra: '.ferramentas', antesDe: '#lVoltar', alvo: '#doc .folha', formatos: ['pdf', 'docx'], classe: 'sec', margemPdf: 0,
    cssPdf: '.drv-pdf .folha{min-height:0!important}', pasta: () => ['Obras', M.obra.nome, 'Medições'] });
})();

// Word (.docx): o documento com o timbre embutido
async function baixarWord() {
  let timbre = '';
  try {
    const b = await (await fetch(TIMBRE)).blob();
    timbre = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result); r.readAsDataURL(b); });
  } catch (_) {}
  const folha = $('doc').querySelector('.folha').cloneNode(true);
  const img = folha.querySelector('.timbre img');
  if (img) { if (timbre) { img.src = timbre; img.width = 250; img.height = 58; } else img.closest('.timbre').remove(); }
  const html = `<!doctype html><html><head><meta charset="utf-8"><style>${RelMedicao.CSS} .rm.folha{width:auto;min-height:0;padding:0}</style></head><body>${folha.outerHTML}</body></html>`;
  const blob = window.htmlDocx ? htmlDocx.asBlob(html, { orientation: 'portrait', margins: { top: 850, bottom: 850, left: 1000, right: 1000 } })
    : new Blob(['﻿', html], { type: 'application/msword' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = document.title.replace(/[\\/:*?"<>|]+/g, '-') + (window.htmlDocx ? '.docx' : '.doc');
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
</script>
</body>
</html>
