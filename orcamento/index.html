<style>
:root{
  --g9:#000;--g8:#6d28d9;--g7:#7c3aed;--g6:#8b5cf6;--g5:#2bff9a;--g1:rgba(139,92,246,.18);--g0:rgba(139,92,246,.10);
  --ink:#ece6ff;--mut:#a497c9;--line:#2a1d4a;--line2:#1d1336;--bg:#05010b;--card:#0e0719;--warn:#fbbf24;--red:#ff5c7a;--blue:#a78bfa;
  --etapa1:#22123f;--etapa2:#190d31;--etapa3:#140a27;--th:#160c2b;--hover:rgba(139,92,246,.09);--selrow:rgba(43,255,154,.12);
  --verde:#2bff9a;--roxo:#8b5cf6;--f-marca:'Orbitron','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  color-scheme:dark;
}
::selection{background:rgba(139,92,246,.45);color:#fff}
*{scrollbar-color:#3b2a66 transparent}
a{color:#a78bfa}a:hover{color:var(--verde)}
/* topo do Sistema de Engenharia (o mesmo de comum/estilo.css) */
.topo{background:linear-gradient(90deg,#000 0%,#12052a 55%,#000 100%);color:#fff;border-bottom:1px solid rgba(139,92,246,.45);
  box-shadow:0 1px 0 rgba(43,255,154,.12),0 6px 24px rgba(0,0,0,.45);display:flex;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap;font:15px/1.45 "Segoe UI",Roboto,Arial,sans-serif}
.topo h1{font-family:var(--f-marca);font-size:.92rem;margin:0;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#f3eeff;
  text-shadow:0 0 12px rgba(139,92,246,.7);display:flex;align-items:center;gap:9px}
.topo h1::before{content:'';width:10px;height:10px;flex:none;background:var(--verde);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);box-shadow:0 0 10px var(--verde)}
.topo nav{display:flex;gap:4px;flex-wrap:wrap}
.topo nav a{color:#c4b5fd;text-decoration:none;padding:6px 10px;border-radius:6px;font-size:.9rem;border:1px solid transparent}
.topo nav a:hover{background:rgba(139,92,246,.16);color:#fff}
.topo nav a.ativo{background:rgba(139,92,246,.22);color:var(--verde);border-color:rgba(43,255,154,.35)}
.topo .usuario{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--mut)}
.topo button.discreto{background:transparent;border:1px solid rgba(139,92,246,.55);color:#c4b5fd;padding:5px 10px;border-radius:6px;cursor:pointer;font:inherit}
.topo button.discreto:hover{border-color:var(--verde);color:#fff}
.appbar{display:flex;align-items:center;gap:12px;padding:6px 18px;background:rgba(14,7,25,.92);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;flex-wrap:wrap}
.rodape{text-align:center;color:var(--mut);font-size:.78rem;margin-top:28px;letter-spacing:.04em}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)!important}.g3,.g4,.g6{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.g2,.g3,.g4,.g6{grid-template-columns:1fr}.grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}}


*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse 120% 60% at 50% -10%,#1a0838 0%,var(--bg) 60%) fixed,var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
nav.main{display:flex;gap:2px}
nav.main button{background:none;border:1px solid transparent;color:#c4b5fd;padding:8px 12px;border-radius:6px;cursor:pointer;font-weight:500}
nav.main button:hover{background:rgba(139,92,246,.16);color:#fff}nav.main button.on{background:rgba(139,92,246,.22);color:var(--verde);border-color:rgba(43,255,154,.35)}
.conn{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;opacity:.9}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.dot.ok{background:var(--verde);box-shadow:0 0 8px var(--verde)}.dot.off{background:var(--red)}
main{padding:18px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:16px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 8px}
.mut{color:var(--mut)}.small{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--roxo);background:var(--hover);color:#fff}
.btn.pri{background:var(--g7);border-color:var(--g7);color:#fff}.btn.pri:hover{background:var(--g8);border-color:var(--verde);box-shadow:0 0 12px rgba(43,255,154,.25)}
.btn.dan{color:var(--red)}.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
input.f,select.f,textarea.f{border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#07030f;color:var(--ink);width:100%}
select option{background:#0e0719;color:var(--ink)}
input::placeholder,textarea::placeholder{color:#5f5283}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 1px var(--verde),0 0 12px rgba(43,255,154,.2)}
:focus-visible{outline:2px solid var(--verde);outline-offset:1px}
label.l{display:block;font-size:11.5px;color:var(--mut);margin-bottom:3px;font-weight:500}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 14px}
.subnav button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.subnav button.on{color:var(--verde);border-color:var(--verde)}
table.t{border-collapse:collapse;width:100%}
table.t th{background:var(--th);text-align:left;font-size:11.5px;color:var(--mut);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
table.t td{padding:5px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.t tr:hover td{background:var(--hover)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.code{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:rgba(148,163,184,.15);color:#cbd5e1}
.tag.SINAPI{background:rgba(96,165,250,.16);color:#93c5fd}.tag.ORSE{background:rgba(251,191,36,.16);color:#fcd34d}.tag.PROPRIA{background:rgba(43,255,154,.13);color:var(--verde)}.tag.MANUAL{background:rgba(244,114,182,.16);color:#f9a8d4}
.tag.I{background:rgba(148,163,184,.12);color:#cbd5e1}.tag.C{background:rgba(139,92,246,.22);color:#c4b5fd}
.plan-wrap{overflow:auto;max-height:calc(100vh - 330px);border:1px solid var(--line);border-radius:8px;background:var(--card)}
#plan td{border-bottom:1px solid var(--line2)}
#plan tr.et1 td{background:var(--etapa1);font-weight:700}
#plan tr.et2 td{background:var(--etapa2);font-weight:600}
#plan tr.et3 td{background:var(--etapa3);font-weight:600}
#plan tr.sel td{background:var(--selrow)!important}
#plan tr{cursor:default}
#plan input.q{width:92px;text-align:right;border:1px solid transparent;background:transparent;color:var(--ink);padding:2px 4px;border-radius:4px;font-variant-numeric:tabular-nums}
#plan input.q:hover{border-color:var(--line)}#plan input.q:focus{border-color:var(--verde);background:#07030f;outline:none}
#plan .desc{max-width:560px}
.warnico{color:var(--warn);font-weight:700;cursor:help}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:12px}
.kpi{background:linear-gradient(180deg,color-mix(in srgb,#3b0764 35%,var(--card)),var(--card));border:1px solid var(--line);border-top:2px solid color-mix(in srgb,var(--roxo) 70%,transparent);border-radius:9px;padding:10px 12px}
.kpi b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--mut)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
/* drawer */
.drawer{position:fixed;top:0;right:0;width:min(760px,96vw);height:100%;background:var(--card);border-left:1px solid rgba(139,92,246,.45);box-shadow:-10px 0 40px rgba(0,0,0,.6);z-index:60;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .18s}
.drawer.open{transform:none}
.drawer .hd{padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .bd{flex:1;overflow:auto}
.res{padding:8px 16px;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;cursor:pointer}
.res:hover{background:var(--g0)}
.res .d{font-size:12.5px}
.res .p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(2px);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:6vh 12px;overflow:auto}
.modal-bg.open{display:flex}
.modal{background:var(--card);border:1px solid rgba(139,92,246,.45);border-radius:12px;width:min(820px,100%);padding:18px 20px;box-shadow:0 0 40px rgba(139,92,246,.2),0 20px 60px rgba(0,0,0,.6)}
.modal.wide{width:min(1150px,100%)}
.modal .ft{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#12052a;border:1px solid rgba(139,92,246,.6);color:var(--ink);padding:9px 16px;border-radius:8px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.empty{padding:40px;text-align:center;color:var(--mut)}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--roxo),var(--verde))}
.abcA td{background:rgba(255,92,122,.13)!important}.abcB td{background:rgba(251,191,36,.10)!important}.abcC td{background:rgba(43,255,154,.06)!important}
.crono input{width:58px;text-align:right;border:1px solid var(--line);border-radius:4px;padding:2px 4px;background:#07030f;color:var(--ink)}
.crono td,.crono th{font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--g1);color:#c4b5fd;text-decoration:none;font-size:11.5px;font-weight:600}
.note{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35);color:#fde68a;padding:8px 12px;border-radius:8px;font-size:12.5px}
.lst-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.lst-item:last-child{border-bottom:0}
.lst-item:hover{background:var(--hover)}
.chk{display:flex;align-items:center;gap:6px;cursor:pointer}
/* documentos do Drive: mesma "folha" da impressão */
.drv-orc{background:#fff}
.drv-orc{font:8pt Arial,Helvetica,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
section.drv-orc{break-after:page;page:auto}
section.drv-orc:last-child{break-after:auto}
section.drv-orc.port{page:port}
.drv-orc table{border-collapse:collapse;width:100%}
.drv-orc table.g td,.drv-orc table.g th{border:0.6pt solid #000;padding:1.5pt 3pt;vertical-align:middle}
.drv-orc table.g th{background:#BFBFBF;font-weight:700;text-align:center}
.drv-orc thead{display:table-header-group}

section.drv-orc.port table.tnr td{padding:0.6pt 3pt}
.drv-orc .k{font-family:Calibri,Carlito,Arial,sans-serif;font-size:10pt}
.drv-orc table.hd th{text-align:right;font:700 9pt Calibri,Carlito,Arial,sans-serif;padding:0 4pt;white-space:nowrap;width:1%}
.drv-orc table.hd td{font:9pt Calibri,Carlito,Arial,sans-serif;padding:0}
.drv-orc td.hdx{text-align:right;font:9pt 'Times New Roman',serif;width:25%}
.drv-orc .tt{text-align:center;font:700 10pt Calibri,Carlito,Arial,sans-serif;margin:6pt 0}
.drv-orc .tt.big{font:700 17pt Arial,sans-serif;border:1pt solid #000;padding:4pt}

.drv-orc table.tot{width:42%;margin:6pt 0 0 auto}.drv-orc table.tot th{text-align:right;background:#BFBFBF;font-family:'Times New Roman',serif}.drv-orc table.tot td{text-align:right;font-weight:700}
.drv-orc table.comp{margin-bottom:10pt;font-size:6.5pt}.drv-orc table.comp tr.e2 td{font-size:7.5pt}

.drv-orc table.bdi{width:80%;margin:0 auto}.drv-orc table.bdi th{text-align:center}

.drv-orc .sig{margin-top:34pt;display:flex;justify-content:center;gap:60pt;text-align:center;font:9pt Calibri,Carlito,Arial,sans-serif;break-inside:avoid}
.drv-orc .sig div{border-top:0.8pt solid #000;padding-top:3pt;min-width:230pt}

<script>
'use strict';
/* =================== CONFIG =================== */
// Endereço e chave do banco vêm de comum/config.js (os mesmos do sistema); o login é o do sistema.
// Padrões dos orçamentos novos (órgão, município, responsável…): SE_CONFIG.ORCAMENTO, em comum/config.js.
const ORC_PAD = { orgao:'', municipio:'', local:'', responsavel:'', crea:'', matricula:'', adm:6, ...((window.SE_CONFIG || {}).ORCAMENTO || {}) };

/* =================== UTILS =================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = v => Math.round((+v + Number.EPSILON) * 100) / 100;
const nf2 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf4 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:4});
const fm = v => v == null || isNaN(v) ? '—' : nf2.format(v);
const fq = v => v == null || isNaN(v) ? '' : nf4.format(v);
const fp = v => v == null || isNaN(v) ? '—' : nf2.format(v * 100) + '%';
const uid = () => crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
const ckey = c => String(c ?? '').trim().toUpperCase().replace(/^0+(?=\d)/, '');
const fonteKey = f => { const n = norm(f).trim(); if (/PROPRI/.test(n)) return 'PRÓPRIA'; if (!n) return ''; return n; };
const tagCls = f => f === 'PRÓPRIA' ? 'PROPRIA' : (f === 'SINAPI' || f === 'ORSE' || f === 'MANUAL' ? f : '');
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const brDate = d => d ? d.split('-').reverse().join('/') : '';
const refBR = r => r ? r.split('-').reverse().join('/') : '';
function parseNum(s){
  if (typeof s === 'number') return s;
  s = String(s ?? '').trim(); if (!s) return NaN;
  if (/^-?[\d.]+,\d+$/.test(s) || /^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else s = s.replace(',', '.');
  return parseFloat(s);
}
function evalExpr(s){ // quantidade com expressão: 2*3,5+4
  s = String(s ?? '').trim(); if (!s) return 0;
  const t = s.replace(/(\d),(\d)/g, '$1.$2').replace(/\s/g, '').replace(/x/gi, '*');
  if (!/^[\d.+\-*/()]+$/.test(t)) return NaN;
  try { const v = Function('"use strict";return (' + t + ')')(); return isFinite(v) ? v : NaN; } catch { return NaN; }
}
function toast(msg, ms=2600){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }
function debounce(fn, ms){ let h; return (...a) => { clearTimeout(h); h = setTimeout(() => fn(...a), ms); }; }

/* ---------- IndexedDB kv ---------- */
const IDB = {
  db: null,
  open(){ if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => { let rq; try { rq = indexedDB.open('obracerta', 1); } catch(e){ return rej(e); }
      rq.onupgradeneeded = () => { const d = rq.result; ['kv'].forEach(s => d.objectStoreNames.contains(s) || d.createObjectStore(s)); };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); }; rq.onerror = () => rej(rq.error); }); },
  async get(k){ try { const d = await this.open(); return await new Promise(r => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(undefined); }); } catch { return undefined; } },
  async set(k, v){ try { const d = await this.open(); return await new Promise(r => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => r(true); tx.onerror = () => r(false); }); } catch { return false; } },
  async del(k){ try { const d = await this.open(); return await new Promise(r => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => r(true); }); } catch { return false; } },
};

/* =================== BANCO (o mesmo do sistema, com login) =================== */
const Store = {
  sb:null, user:null, online:false,
  async init(){
    this.sb = SE.sb;
    this.user = await SE.exigirLogin();
    if (!this.user) return false;
    $('#uEmail').textContent = this.user.email || '';
    $('#bSair').onclick = () => SE.sair();
    this.online = true; this.estado(true);
    return true;
  },
  estado(ok, txt){ $('#conn-dot').className = 'dot ' + (ok ? 'ok' : 'off'); $('#conn-txt').textContent = txt || (ok ? 'Conectado ao sistema' : 'Sem conexão com o banco'); },
  // executa a consulta e devolve os dados (ou lança o erro, com mensagem legível)
  async q(consulta){
    let r; try { r = await consulta; } catch(e){ this.estado(false); throw e; }
    if (r.error){ if (/fetch|network/i.test(r.error.message || '')) this.estado(false); throw new Error(r.error.message || 'Erro no banco'); }
    this.estado(true); return r.data;
  },
  // ---- orçamentos (tabela orcamentos, app = 'obracerta')
  async listOrcs(obraId){
    let c = this.sb.from('orcamentos').select('id,titulo,updated_at,obra_id,total,resumo:dados->resumo,obras(nome)').eq('app', 'obracerta').order('updated_at', { ascending:false });
    if (obraId) c = c.eq('obra_id', obraId);
    return (await this.q(c)).map(o => ({ id:o.id, nome:o.titulo, atualizado_em:o.updated_at, resumo:o.resumo, obra_id:o.obra_id, obra_nome:o.obras?.nome || '' }));
  },
  async getOrc(id){
    const o = await this.q(this.sb.from('orcamentos').select('id,titulo,dados,updated_at,obra_id').eq('id', id).eq('app', 'obracerta').maybeSingle());
    return o && { id:o.id, nome:o.titulo, dados:o.dados, atualizado_em:o.updated_at, obra_id:o.obra_id };
  },
  async stampOrc(id){ return (await this.q(this.sb.from('orcamentos').select('updated_at').eq('id', id).maybeSingle()))?.updated_at; },
  async saveOrc(row){
    const d = row.dados || {};
    const reg = { id:row.id, app:'obracerta', titulo:String(row.nome || '').trim() || 'Sem título', dados:d,
      total:d.resumo?.final ?? null, obra_id:d.obra_id || null };
    return (await this.q(this.sb.from('orcamentos').upsert(reg).select('updated_at').single())).updated_at;
  },
  async delOrc(id){ await this.q(this.sb.from('orcamentos').delete().eq('id', id)); },
  // ---- composições próprias (de cada usuário)
  async listProp(){ return (await this.q(this.sb.from('orc_proprias').select('id,codigo,dados').order('codigo'))).map(r => ({ ...r.dados, id:r.id, codigo:r.codigo })); },
  async saveProp(p){ await this.q(this.sb.from('orc_proprias').upsert({ id:p.id, codigo:p.codigo, dados:p })); },
  async delProp(id){ await this.q(this.sb.from('orc_proprias').delete().eq('id', id)); },
  // ---- bases importadas (todos leem; só quem importou altera)
  async listBases(){ return this.q(this.sb.from('orc_bases').select('id,user_id,fonte,uf,referencia,descricao,meta,versao_itens,versao_anal').not('versao_itens', 'is', null).order('fonte')); },
  async loadBaseItems(id, onProg){
    const b = await this.q(this.sb.from('orc_bases').select('versao_itens,versao_anal').eq('id', id).maybeSingle());
    if (!b || !b.versao_itens) return { itens:[], anal:[] };
    const stamp = b.versao_itens + '|' + (b.versao_anal || ''), cacheKey = 'base:' + id;
    const cached = await IDB.get(cacheKey); if (cached && cached.stamp === stamp) return cached;
    const pull = async (table, cols, versao) => { const out = []; if (!versao) return out; const N = 1000;
      for (let from = 0; ; from += N){
        const data = await this.q(this.sb.from(table).select(cols).eq('base_id', id).eq('versao', versao).order('id').range(from, from + N - 1));
        out.push(...data); onProg && onProg(out.length); if (data.length < N) break; }
      return out; };
    const itens = await pull('orc_base_itens', 'tipo,codigo,descricao,unidade,grupo,preco_nd,preco_d,extra', b.versao_itens);
    const anal = await pull('orc_base_analitico', 'comp_codigo,item_tipo,item_codigo,coef', b.versao_anal);
    const res = { stamp, itens, anal }; IDB.set(cacheKey, res); return res;
  },
  // As linhas entram numa versão nova; só no fim orc_base_publicar troca a versão ativa (tudo ou nada).
  // Se a importação cair no meio, a versão incompleta é descartada e a base antiga continua inteira.
  async saveBase(meta, itens, anal, onProg){
    const ja = await this.q(this.sb.from('orc_bases').select('id,user_id').eq('id', meta.id).maybeSingle());
    if (ja && ja.user_id !== this.user.id) throw new Error('Esta base foi importada por outro usuário; só quem importou pode alterá-la.');
    const cab = { fonte:meta.fonte, uf:meta.uf || null, referencia:meta.referencia || null, descricao:meta.descricao || null };
    if (ja) await this.q(this.sb.from('orc_bases').update(cab).eq('id', meta.id));
    else await this.q(this.sb.from('orc_bases').insert({ id:meta.id, ...cab }));
    const vI = itens ? uid() : null, vA = anal ? uid() : null;
    const enviar = async (table, rows, versao, N) => {
      for (let i = 0; i < rows.length; i += N){
        await this.q(this.sb.from(table).insert(rows.slice(i, i + N).map(x => ({ ...x, base_id:meta.id, versao }))));
        onProg && onProg(Math.min(i + N, rows.length), rows.length); } };
    try {
      if (itens) await enviar('orc_base_itens', itens.map(x => ({ tipo:x.tipo, codigo:String(x.codigo), descricao:x.descricao ?? null, unidade:x.unidade ?? null,
        grupo:x.grupo ?? null, preco_nd:x.preco_nd ?? null, preco_d:x.preco_d ?? null, extra:x.extra ?? null })), vI, 500);
      if (anal) await enviar('orc_base_analitico', anal.map(x => ({ comp_codigo:String(x.comp_codigo), item_tipo:x.item_tipo, item_codigo:String(x.item_codigo), coef:x.coef })), vA, 1000);
      await this.q(this.sb.rpc('orc_base_publicar', { p_base:meta.id, p_versao_itens:vI, p_versao_anal:vA, p_meta:meta.meta || {} }));
    } catch(e){
      for (const v of [vI, vA]) if (v) { try { await this.sb.rpc('orc_base_descartar', { p_base:meta.id, p_versao:v }); } catch {} }
      throw e;
    }
    await IDB.del('base:' + meta.id);
  },
  async delBase(id){
    const r = await this.q(this.sb.from('orc_bases').delete().eq('id', id).select('id'));
    if (!r.length) throw new Error('Só quem importou a base pode excluí-la.');
    await IDB.del('base:' + id);
  },
};

/* =================== BASES DE PREÇO =================== */
const Bases = {
  list: [],         // metas {id,fonte,uf,ref,desc,embedded(=pronta do sistema),arquivo,dono}
  data: {},         // id -> base carregada
  props: [],        // composições próprias
  propMap: new Map(),
  async init(){
    // bases prontas: arquivos em orcamento/bases, listados em bases/obracerta.json (carregadas só quando usadas)
    this.list = [];
    try {
      const r = await fetch('bases/obracerta.json', { cache:'no-cache' }); if (!r.ok) throw new Error('HTTP ' + r.status);
      for (const c of await r.json()) this.list.push({ id:c.id, fonte:c.fonte, uf:c.uf, ref:c.ref, desc:c.desc, arquivo:c.arquivo, embedded:true, nI:c.nI, nC:c.nC, hasA:!!c.nA });
    } catch(e){ console.warn(e); toast('Não consegui ler a lista de bases prontas (bases/obracerta.json): ' + e.message, 7000); }
    try {
      for (const b of await Store.listBases()){
        if (this.list.some(x => x.id === b.id)) continue;
        this.list.push({ id:b.id, fonte:b.fonte, uf:b.uf, ref:b.referencia, desc:b.descricao, nI:b.meta?.nI, nC:b.meta?.nC, hasA:!!b.versao_anal, dono:b.user_id });
      }
    } catch(e){ console.warn(e); toast('Erro ao listar as bases importadas: ' + e.message, 6000); }
    await this.reloadProps();
  },
  // base mais recente de uma fonte (ex.: SINAPI): é a que os orçamentos novos usam
  padrao(fonte='SINAPI'){ return this.basesByFonte(fonte)[0]?.id || null; },
  async reloadProps(){
    try { this.props = await Store.listProp(); } catch(e){ console.warn(e); this.props = []; toast('Erro ao carregar as composições próprias: ' + e.message, 6000); }
    this.propMap = new Map(this.props.map(p => [ckey(p.codigo), p]));
  },
  decode(j){
    const b = { id:j.id, fonte:j.fonte, uf:j.uf, ref:j.ref, desc:j.desc, encargos:j.encargos, I:new Map(), C:new Map(), A:new Map() };
    for (const [c, d, u, nd, dd, o] of j.I) b.I.set(ckey(c), { t:'I', c, d, u, nd, dd, o });
    for (const [c, d, u, g, nd, dd, asn, asd] of j.C) b.C.set(ckey(c), { t:'C', c, d, u, g:j.grupos[g], nd, dd, asn, asd });
    for (const [k, its] of Object.entries(j.A || {})) b.A.set(ckey(k), its.map(([t, c, coef]) => ({ t, k:ckey(c), coef })));
    return b;
  },
  async baixar(m){
    const r = await fetch('bases/' + m.arquivo);
    if (!r.ok) throw new Error(`arquivo da base ${m.desc || m.id} não encontrado (${r.status})`);
    const buf = new Uint8Array(await r.arrayBuffer());
    // .gz: o GitHub Pages entrega comprimido; se o navegador já descomprimiu, lê direto
    const txt = buf[0] === 0x1f && buf[1] === 0x8b
      ? await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
      : new TextDecoder().decode(buf);
    return this.decode(JSON.parse(txt));
  },
  meta(id){ return this.list.find(b => b.id === id); },
  async ensure(id, onProg){
    if (!id) return null;
    if (this.data[id]) return this.data[id];
    this._carregando ||= {};
    if (this._carregando[id]) return this._carregando[id];
    const m = this.meta(id);
    const p = (async () => {
      if (m?.embedded){ const b = await this.baixar(m); m.nI = b.I.size; m.nC = b.C.size; m.hasA = b.A.size > 0; return this.data[id] = b; }
      const raw = await Store.loadBaseItems(id, onProg);
      const b = { id, fonte:m?.fonte, uf:m?.uf, ref:m?.ref, desc:m?.desc, I:new Map(), C:new Map(), A:new Map() };
      for (const x of raw.itens) (x.tipo === 'I' ? b.I : b.C).set(ckey(x.codigo), { t:x.tipo, c:x.codigo, d:x.descricao, u:x.unidade, g:x.grupo, nd:x.preco_nd == null ? null : +x.preco_nd, dd:x.preco_d == null ? null : +x.preco_d, ...(x.extra || {}) });
      for (const a of raw.anal){ const k = ckey(a.comp_codigo); if (!b.A.has(k)) b.A.set(k, []); b.A.get(k).push({ t:a.item_tipo, k:ckey(a.item_codigo), coef:+a.coef }); }
      if (m) m.hasA = b.A.size > 0;
      return this.data[id] = b;
    })();
    this._carregando[id] = p;
    try { return await p; } finally { delete this._carregando[id]; }
  },
  searchList(b){
    if (!b._search){ b._search = [];
      for (const m of [b.I, b.C]) for (const r of m.values()) b._search.push({ r, n: norm(r.d) + ' ' + r.c + ' ' + ckey(r.c) }); }
    return b._search;
  },
  find(b, code){ const k = ckey(code); return b.C.get(k) || b.I.get(k) || null; },
  price(r, des){ if (!r) return null; const v = des ? r.dd : r.nd; return v == null ? null : +v; },
  // custo de composição própria (recursivo)
  propCost(p, ctx, depth=0){
    if (!p || depth > 8) return { total:null, faltando:['recursão'] };
    let total = 0; const faltando = [];
    for (const it of p.itens || []){
      const v = this.unitCost(it.fonte, it.codigo, ctx, depth + 1, it.preco);
      const pr = v.price ?? (it.preco != null && !isNaN(+it.preco) ? +it.preco : null);
      if (pr == null){ faltando.push(it.codigo); continue; }
      total += pr * (+it.coef || 0);
    }
    return { total:r2(total), faltando };
  },
  // preço unitário de qualquer referência (sem BDI)
  unitCost(fonte, codigo, ctx, depth=0, manual=null){
    fonte = fonteKey(fonte);
    if (fonte === 'PRÓPRIA'){ const p = this.propMap.get(ckey(codigo)); if (!p) return { price:null, rec:null };
      const c = this.propCost(p, ctx, depth); return { price:c.total, rec:{ t:'C', c:p.codigo, d:p.descricao, u:p.unidade, prop:p }, faltando:c.faltando }; }
    if (fonte === 'MANUAL' || fonte === 'COTAÇÃO') return { price: manual, rec:null };
    const bid = ctx.bases?.[fonte]; const b = bid && this.data[bid];
    if (!b) return { price:null, rec:null };
    const r = this.find(b, codigo);
    return { price:this.price(r, ctx.des), rec:r, base:b };
  },
  fontes(){ const s = new Set(this.list.map(b => b.fonte)); return [...s]; },
  basesByFonte(f){ return this.list.filter(b => b.fonte === f).sort((a, b) => (b.ref || '').localeCompare(a.ref || '')); },
};

/* =================== MODELO DO ORÇAMENTO =================== */
const BDI_DEF = { ac:4.00, sg:0.80, r:1.27, g:0, df:1.23, l:7.40, pis:0.65, cofins:3.00, iss:2.00, cprb:4.50, dif:{ on:false, ac:3.45, sg:0.48, r:0.85, g:0.85, df:0.85, l:5.11 } };
function bdiCalc(b, dif=false, des=false){
  if (!dif && b.fixoOn && b.fixo != null) return Math.round(+b.fixo * 100) / 10000;
  const s = dif ? { ...b, ...b.dif } : b;
  const I = (+b.pis + +b.cofins + +b.iss + (des ? +b.cprb : 0)) / 100;
  const v = ((1 + (+s.ac + +s.sg + +s.r + +s.g) / 100) * (1 + +s.df / 100) * (1 + +s.l / 100)) / (1 - I) - 1;
  return Math.round(v * 10000) / 10000;
}
function novoOrc(){
  const sin = Bases.padrao('SINAPI');
  return { id:uid(), nome:'Novo orçamento', orgao:ORC_PAD.orgao, obra:'', endereco:'', municipio:ORC_PAD.municipio, assunto:'', os:'', local:ORC_PAD.local, processo:'', data:today(),
    responsavel:ORC_PAD.responsavel, crea:ORC_PAD.crea, matricula:ORC_PAD.matricula, desconto:0, obra_id:null, bases: sin ? { SINAPI:sin } : {}, des:false,
    bdi:JSON.parse(JSON.stringify(BDI_DEF)), adm:+ORC_PAD.adm || 0, itens:[], crono:{ meses:6, dist:{} } };
}
const Orc = {
  doc:null, stamp:null, dirty:false, sel:new Set(), lastSel:null,
  ctx(){ return { bases:this.doc.bases, des:this.doc.des }; },
  bdiN(){ return bdiCalc(this.doc.bdi, false, this.doc.des); }, bdiD(){ return bdiCalc(this.doc.bdi, true, this.doc.des); },
  // recalcula preços e totais
  calc(){
    const d = this.doc, ctx = this.ctx(), bN = this.bdiN(), bD = d.bdi.dif?.on ? this.bdiD() : bN;
    const cnt = []; let curLevel = 0; const stack = [];
    let total = 0, totalSem = 0;
    for (const it of d.itens){
      if (it.tipo === 'etapa'){
        const L = Math.min(Math.max(it.nivel || 1, 1), Math.min(curLevel + 1, 3) || 1);
        it.nivel = L; cnt.length = L; cnt[L - 1] = (cnt[L - 1] || 0) + 1;
        for (let i = 0; i < L; i++) if (!cnt[i]) cnt[i] = 1;
        it.num = cnt.slice(0, L).join('.'); curLevel = L;
        stack.length = L - 1; stack.push(it); it._tot = 0; it._sem = 0; continue;
      }
      const depth = curLevel; cnt.length = depth + 1; cnt[depth] = (cnt[depth] || 0) + 1;
      it.num = cnt.slice(0, depth + 1).join('.');
      let custo = null, warn = '';
      if (it.manual){ custo = it.custo; }
      else { const u = Bases.unitCost(it.fonte, it.codigo, ctx, 0, it.custo);
        custo = u.price; if (u.rec === null && it.fonte !== 'MANUAL') warn = 'Não encontrado na base selecionada — usando o último preço conhecido';
        if (custo == null){ custo = it.custo ?? 0; if (!warn) warn = 'Sem preço na base para esta referência'; }
        else it.custo = custo;
        if (u.rec && u.rec.asn != null && !d.des && u.rec.asn > 0) warn = warn || `${u.rec.asn}% do custo atribuído a São Paulo (%AS)`;
        if (u.faltando && u.faltando.length) warn = 'Composição própria com insumo sem preço: ' + u.faltando.join(', ');
      }
      it._custo = r2(custo || 0); it._bdi = it.bdiDif ? bD : bN;
      it._pu = r2((it.manual ? (+custo || 0) : it._custo) * (1 + it._bdi));
      it._tot = r2((+it.qtd || 0) * it._pu); it._sem = r2((+it.qtd || 0) * it._custo);
      it._warn = warn;
      total += it._tot; totalSem += it._sem;
      for (const e of stack){ e._tot += it._tot; e._sem += it._sem; }
    }
    total = r2(total); totalSem = r2(totalSem);
    const adm = r2(totalSem * (+d.adm || 0) / 100 * (1 + bN));
    const geral = r2(total + adm), desconto = r2(geral * (+d.desconto || 0) / 100);
    d.resumo = { total, totalSem, bdi:r2(total - totalSem), adm, geral, desconto, final:r2(geral - desconto), referencia:!!d.referencia, itens:d.itens.filter(i => i.tipo !== 'etapa').length, bdiPct:bN, ref:this.refLabel(), atualizado:new Date().toISOString() };
    return d.resumo;
  },
  refLabel(){ if (this.doc.refTexto && this.doc.referencia) return this.doc.refTexto; return Object.entries(this.doc.bases || {}).filter(([, v]) => v).map(([f, id]) => { const m = Bases.meta(id); return m ? `${f} ${m.uf || ''} ${refBR(m.ref)}`.replace(/\s+/g, ' ') : f; }).join(' · ') + (this.doc.des ? ' (desonerado)' : ' (não desonerado)'); },
  async open(id){
    const row = await Store.getOrc(id); if (!row) throw new Error('Orçamento não encontrado');
    this.doc = { ...novoOrc(), ...row.dados, id:row.id, nome:row.nome, obra_id:row.obra_id || null };
    this.doc.bdi = { ...JSON.parse(JSON.stringify(BDI_DEF)), ...this.doc.bdi, dif:{ ...BDI_DEF.dif, ...(this.doc.bdi?.dif || {}) } };
    this.stamp = row.atualizado_em; this.sel.clear(); this.dirty = false;
    for (const id of Object.values(this.doc.bases)) if (id) await Bases.ensure(id).catch(e => toast('Erro ao carregar base: ' + e.message));
    this.calc();
  },
  touch(){ this.dirty = true; this.calc(); this.autosave(); UI.setSaveState('Alterações não salvas…'); },
  autosave: debounce(() => Orc.save(), 1500),
  async save(force=false){
    if (!this.doc) return;
    try {
      if (!force){ const remote = await Store.stampOrc(this.doc.id);
        if (remote && this.stamp && remote > this.stamp){ UI.conflict(); return; } }
      const dados = JSON.parse(JSON.stringify(this.doc, (k, v) => k.startsWith('_') ? undefined : v));
      this.stamp = await Store.saveOrc({ id:this.doc.id, nome:this.doc.nome, dados });
      this.dirty = false; UI.setSaveState('Salvo ' + new Date().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' }));
    } catch(e){ console.error(e); UI.setSaveState('Erro ao salvar'); toast('Erro ao salvar: ' + e.message, 5000); }
  },
  idx(id){ return this.doc.itens.findIndex(i => i.id === id); },
  insertAt(){ // posição após a seleção
    if (!this.sel.size) return this.doc.itens.length;
    const ids = [...this.sel]; let mx = -1; ids.forEach(id => mx = Math.max(mx, this.idx(id)));
    // se selecionou etapa, inserir ao fim dela
    const it = this.doc.itens[mx];
    if (it && it.tipo === 'etapa'){ let j = mx + 1; while (j < this.doc.itens.length && !(this.doc.itens[j].tipo === 'etapa' && this.doc.itens[j].nivel <= it.nivel)) j++; return j; }
    return mx + 1;
  },
  addEtapa(nivel){ const pos = this.insertAt(); let n = nivel;
    if (n == null){ const it = this.doc.itens[pos - 1]; n = 1; if (it) n = it.tipo === 'etapa' ? it.nivel : (this.parentOf(pos - 1)?.nivel || 1); }
    const e = { id:uid(), tipo:'etapa', nivel:n, titulo:'NOVA ETAPA' }; this.doc.itens.splice(pos, 0, e); this.sel = new Set([e.id]); this.touch(); return e; },
  parentOf(i){ for (let j = i; j >= 0; j--) if (this.doc.itens[j].tipo === 'etapa') return this.doc.itens[j]; return null; },
  addItem(rec, fonte, qtd=1){
    if (!this.doc.itens.some(i => i.tipo === 'etapa')) this.doc.itens.push({ id:uid(), tipo:'etapa', nivel:1, titulo:'SERVIÇOS' });
    const pos = this.insertAt();
    const it = { id:uid(), tipo:'item', fonte, codigo:rec.c, descricao:rec.d, unidade:rec.u, tref:rec.t, qtd, qexpr:'', custo:null, manual:fonte === 'MANUAL', bdiDif:false };
    if (fonte === 'MANUAL') it.custo = rec.preco || 0;
    this.doc.itens.splice(pos, 0, it); this.sel = new Set([it.id]); this.touch(); return it;
  },
  delSel(){ const ids = this.sel; if (!ids.size) return;
    this.doc.itens = this.doc.itens.filter(i => !ids.has(i.id)); this.sel = new Set(); this.touch(); },
  move(dir){ const it = this.doc.itens; const idxs = [...this.sel].map(id => this.idx(id)).sort((a, b) => a - b); if (!idxs.length) return;
    if (dir < 0 && idxs[0] === 0) return; if (dir > 0 && idxs[idxs.length - 1] === it.length - 1) return;
    const order = dir < 0 ? idxs : idxs.reverse();
    for (const i of order){ const j = i + dir; [it[i], it[j]] = [it[j], it[i]]; } this.touch(); },
  indent(d){ for (const id of this.sel){ const it = this.doc.itens[this.idx(id)]; if (it?.tipo === 'etapa') it.nivel = Math.max(1, Math.min(3, it.nivel + d)); } this.touch(); },
  async repricing(){ for (const it of this.doc.itens) if (it.tipo === 'item' && it.manual && it.importado){ const u = Bases.unitCost(it.fonte, it.codigo, this.ctx()); if (u.price != null){ it.manual = false; it.importado = false; } } this.touch(); },
};

  /* ---------- Drawer de pesquisa ---------- */
  drawerCb:null, drawerFontes:[], drawerTipo:'',
  openDrawer({ title='Inserir item', fontes, ctx, onPick, keepOpen=true }){

    $('#dr-filters').innerHTML = fl + `<span class="sep"></span><select class="f" id="dr-tipo" style="width:auto;padding:3px 6px"><option value="">Insumos e composições</option><option value="C">Só composições</option><option value="I">Só insumos</option></select>

  search(){
    const q = norm($('#dr-q').value).trim(); const out = $('#dr-res');
    if (q.length < 2){ out.innerHTML = ''; return; }
    const toks = q.split(/\s+/).filter(Boolean);
    const fontes = $$('#dr-filters input[data-f]').filter(x => x.checked).map(x => x.dataset.f);
    const tipo = $('#dr-tipo').value; const ctx = this.drawerCtx; const res = [];
    for (const f of fontes){
      if (f === 'PRÓPRIA'){ for (const p of Bases.props){ const n = norm(p.descricao) + ' ' + norm(p.codigo); if (tipo === 'I') continue; if (toks.every(t => n.includes(t))) res.push({ f, r:{ t:'C', c:p.codigo, d:p.descricao, u:p.unidade }, score:0 }); } continue; }
      const b = Bases.data[ctx.bases?.[f]]; if (!b) continue;
      for (const s of Bases.searchList(b)){ if (tipo && s.r.t !== tipo) continue;
        if (toks.every(t => s.n.includes(t))){ const sc = (s.r.c === q || ckey(s.r.c) === ckey(q)) ? -2 : (s.n.startsWith(toks[0]) ? -1 : 0); res.push({ f, r:s.r, score:sc }); if (res.length > 1500) break; } }

        <div class="d"><span class="code">${esc(x.r.c)}</span> — ${esc(x.r.d)}${x.r.asn ? ` <span class="warnico" title="%AS: parte do custo com preço de São Paulo">AS ${x.r.asn}%</span>` : ''}${x.r.g ? `<div class="small mut">${esc(x.r.g)}</div>` : ''}</div>
        <div class="p"><b>${u.price == null ? '<span class="mut">sem preço</span>' : 'R$ ' + fm(u.price)}</b><div class="small mut">${esc(x.r.u || '')}</div></div></div>`; }).join('');
    $$('.res', out).forEach(el => el.onclick = () => { const x = show[+el.dataset.i]; this.drawerCb(x.r, x.f); el.style.background = 'rgba(43,255,154,.15)'; if (!this.drawerKeep) this.closeDrawer(); else toast('Inserido: ' + x.r.c); });

      <div style="margin-top:10px"><label class="l">Descrição</label><textarea class="f" id="m-d" rows="3"></textarea></div>

/* ---------- Analítico (abertura de composição) ---------- */
function analRows(b, code, des){ const its = b?.A.get(ckey(code)); if (!its) return null;
  return its.map(i => { const r = i.t === 'I' ? b.I.get(i.k) : b.C.get(i.k); const p = Bases.price(r, des); return { t:i.t, c:r?.c || i.k, d:r?.d || '(não encontrado na base)', u:r?.u || '', coef:i.coef, pu:p, tot:p == null ? null : p * i.coef }; }); }
function analTable(rows){ if (!rows) return ''; const tot = rows.reduce((a, x) => a + (x.tot || 0), 0);
  return `<table class="t" style="margin-top:6px"><thead><tr><th>Tipo</th><th>Código</th><th>Descrição</th><th>Und</th><th class="n">Coef.</th><th class="n">Preço unit.</th><th class="n">Total</th></tr></thead><tbody>
    ${rows.map(x => `<tr><td><span class="tag ${x.t}">${x.t === 'C' ? 'COMP' : 'INSUMO'}</span></td><td class="code">${esc(x.c)}</td><td class="small">${esc(x.d)}</td><td>${esc(x.u)}</td><td class="n">${nf4.format(x.coef)}</td><td class="n">${x.pu == null ? '<span class="warnico">sem preço</span>' : fm(x.pu)}</td><td class="n">${fm(x.tot)}</td></tr>`).join('')}
    <tr><td colspan="6" class="n"><b>Soma dos itens</b></td><td class="n"><b>${fm(tot)}</b></td></tr></tbody></table>`; }
function copiarComoPropria(b, rec){ const rows = analRows(b, rec.c, false); if (!rows) return toast('Composição sem analítico');
  const n = Bases.props.reduce((m, p) => Math.max(m, parseInt(String(p.codigo).replace(/\D/g, '')) || 0), 0) + 1;
  Prop.cur = { id:uid(), codigo:'CP-' + String(n).padStart(4, '0'), descricao:rec.d, unidade:rec.u, grupo:rec.g || '', obs:`COMPOSIÇÃO UTILIZADA ${b.fonte} - ${rec.c}`, novo:true,
    itens:rows.map(x => ({ fonte:b.fonte, tipo:x.t, codigo:x.c, descricao:x.d, unidade:x.u, coef:x.coef })) };
  Prop.ctx = { bases:{ [b.fonte]:b.id }, des:false }; UI.closeModal(); UI.closeDrawer(); UI.go('proprias'); toast('Ajuste os coeficientes e salve a nova composição'); }

/* ---------- Dados e BDI ---------- */
const Dados = {
  render(s){
    const d = Orc.doc, b = d.bdi;

      <div class="card"><h2>BDI (fórmula do Acórdão TCU 2.622/2013)</h2>

        <div class="grid g3">${fld('ac', 'Administração central – AC (%)')}${fld('sg', 'Seguro e garantia – S+G (%)')}${fld('r', 'Risco – R (%)')}${fld('g', 'Garantia extra – G (%)')}${fld('df', 'Despesas financeiras – DF (%)')}${fld('l', 'Lucro – L (%)')}</div>

  body(){

    for (const it of d.itens){
      if (it.tipo === 'etapa'){ if (f) continue;
        rows.push(`<tr class="et${it.nivel} ${Orc.sel.has(it.id) ? 'sel' : ''}" data-id="${it.id}"><td>${it.num}</td><td colspan="8">${esc(it.titulo)}</td><td class="n">${fm(it._tot)}</td><td class="n">${fp(it._tot / tot)}</td></tr>`); continue; }
      if (f && !(norm(it.descricao) + ' ' + norm(it.codigo)).includes(f)) continue;
      rows.push(`<tr class="${Orc.sel.has(it.id) ? 'sel' : ''}" data-id="${it.id}"><td>${it.num}</td><td class="code">${esc(it.codigo)}</td><td><span class="tag ${tagCls(it.fonte)}">${esc(it.fonteLabel || it.fonte)}</span></td>
        <td class="desc">${esc(it.descricao)} ${it._warn ? `<span class="warnico" title="${esc(it._warn)}">⚠</span>` : ''}${it.manual && it.fonte !== 'MANUAL' ? ' <span class="tag MANUAL" title="Preço informado manualmente/importado">preço fixo</span>' : ''}</td>
        <td>${esc(it.unidade)}</td><td class="n"><input class="q" data-q="${it.id}" value="${esc(it.qexpr || fq(it.qtd))}" title="${it.qexpr ? '= ' + fq(it.qtd) : ''}"></td>

  },
  refresh(){ const sc = $('.plan-wrap').scrollTop; UI.renderOrc($('#view')); $('.plan-wrap').scrollTop = sc; },
  bind(s){
    const tb = $('#plan tbody');
    tb.onclick = e => { if (e.target.matches('input')) return; const tr = e.target.closest('tr[data-id]'); if (!tr) return; const id = tr.dataset.id;
      if (e.shiftKey && Orc.lastSel){ const a = Orc.idx(Orc.lastSel), b = Orc.idx(id); for (let i = Math.min(a, b); i <= Math.max(a, b); i++) Orc.sel.add(Orc.doc.itens[i].id); }
      else if (e.ctrlKey || e.metaKey){ Orc.sel.has(id) ? Orc.sel.delete(id) : Orc.sel.add(id); }
      else Orc.sel = new Set([id]);
      Orc.lastSel = id; $$('tr[data-id]', tb).forEach(r => r.classList.toggle('sel', Orc.sel.has(r.dataset.id))); };
    tb.ondblclick = e => { const tr = e.target.closest('tr[data-id]'); if (tr && !e.target.matches('input')) this.edit(tr.dataset.id); };
    tb.onchange = e => { const id = e.target.dataset.q; if (!id) return; const it = Orc.doc.itens[Orc.idx(id)]; const raw = e.target.value.trim();
      const v = evalExpr(raw); if (isNaN(v)){ toast('Quantidade inválida'); e.target.value = fq(it.qtd); return; }
      it.qtd = Math.round(v * 10000) / 10000; it.qexpr = /[+\-*/()x]/i.test(raw.replace(/^-/, '')) ? raw : ''; Orc.touch(); this.refresh(); };
    tb.onkeydown = e => { if (e.key === 'Enter' && e.target.dataset.q){ e.preventDefault(); const ins = $$('input.q', tb); const i = ins.indexOf(e.target); e.target.blur(); ins[i + 1]?.focus(); ins[i + 1]?.select(); } };
    $('#t-add').onclick = () => {
      const fontes = Object.keys(Orc.doc.bases).filter(f => Orc.doc.bases[f]).concat('PRÓPRIA');
      UI.openDrawer({ fontes, ctx:Orc.ctx(), onPick:(rec, fonte, label) => { const it = Orc.addItem(rec, fonte); if (label) it.fonteLabel = label; this.refresh(); } });
    };
    $('#t-et').onclick = () => { const e = Orc.addEtapa(1); this.refresh(); this.edit(e.id); };
    $('#t-sub').onclick = () => { const pos = Orc.insertAt(); const p = Orc.parentOf(pos - 1); const e = Orc.addEtapa(Math.min(3, (p?.nivel || 0) + 1)); this.refresh(); this.edit(e.id); };
    $('#t-up').onclick = () => { Orc.move(-1); this.refresh(); }; $('#t-dn').onclick = () => { Orc.move(1); this.refresh(); };
    $('#t-in').onclick = () => { Orc.indent(1); this.refresh(); }; $('#t-out').onclick = () => { Orc.indent(-1); this.refresh(); };
    $('#t-edit').onclick = () => { const id = [...Orc.sel][0]; id ? this.edit(id) : toast('Selecione uma linha'); };
    $('#t-del').onclick = async () => { if (!Orc.sel.size) return toast('Selecione linhas'); const n = Orc.sel.size;

      if (await UI.confirm(`Excluir ${n} linha(s)?${hasEt ? ' Os itens dentro das etapas excluídas passam para a etapa anterior.' : ''}`, 'Excluir')){ Orc.delSel(); this.refresh(); } };
    $('#t-reprice').onclick = async () => { const n = Orc.doc.itens.filter(i => i.manual && i.importado).length; if (!n) return toast('Nenhum item importado com preço fixo');

      <div style="margin-top:10px"><label class="l">Descrição</label><textarea class="f" id="i-d" rows="3">${esc(it.descricao)}</textarea></div>
      <div class="grid g3" style="margin-top:10px">
        <div><label class="l">Preço da base (sem BDI)</label><input class="f" disabled value="${u.price == null ? 'não encontrado' : 'R$ ' + fm(u.price)}"></div>
        <div><label class="chk" style="margin-top:20px"><input type="checkbox" id="i-man" ${it.manual ? 'checked' : ''}> Usar preço fixo informado</label></div>
        <div><label class="l">Custo unitário fixo (sem BDI)</label><input class="f" id="i-p" value="${it.custo == null ? '' : fm(it.custo)}"></div></div>

      <div style="margin-top:10px"><label class="l">Memória de cálculo da quantidade</label><textarea class="f" id="i-mem" rows="2">${esc(it.memoria || '')}</textarea></div>
      ${u.base && u.rec?.t === 'C' && u.base.A.get(ckey(u.rec.c)) ? `<details style="margin-top:10px"><summary style="cursor:pointer;font-weight:600">Ver composição analítica (${u.base.A.get(ckey(u.rec.c)).length} itens)</summary>${analTable(analRows(u.base, u.rec.c, Orc.doc.des))}<button class="btn sm" id="i-cp" style="margin-top:8px">Copiar como composição própria</button></details>` : ''}
      ${u.rec?.prop ? `<div class="note" style="margin-top:10px">Composição própria ${esc(u.rec.prop.codigo)} — custo calculado pelos insumos: R$ ${fm(u.price)}</div>` : ''}
      <div class="ft"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn pri" id="i-ok">Salvar</button></div>`);
    $('#i-cp') && ($('#i-cp').onclick = () => copiarComoPropria(u.base, u.rec));

      it.qtd = Math.round(q * 10000) / 10000; it.qexpr = /[+\-*/()x]/i.test($('#i-q').value.trim().replace(/^-/, '')) ? $('#i-q').value.trim() : '';

  },

/* ---------- Curva ABC ---------- */
const ABC = {
  modo:'serv',
  servicos(){
    const m = new Map();
    for (const it of Orc.doc.itens){ if (it.tipo !== 'item') continue; const k = it.fonte + '|' + ckey(it.codigo);
      const x = m.get(k) || { fonte:it.fonteLabel || it.fonte, codigo:it.codigo, descricao:it.descricao, unidade:it.unidade, qtd:0, pu:it._pu, total:0 };
      x.qtd += +it.qtd || 0; x.total += it._tot; m.set(k, x); }
    return this.classify([...m.values()]);
  },
  insumos(){
    const ctx = Orc.ctx(), m = new Map(); let semAnal = 0;
    const add = (fonte, rec, qty, mult) => { const k = fonte + '|' + ckey(rec.c); const pu = Bases.unitCost(fonte, rec.c, ctx).price ?? 0;
      const x = m.get(k) || { fonte, codigo:rec.c, descricao:rec.d, unidade:rec.u, qtd:0, pu:r2(pu * mult), total:0, tipo:tipoInsumo(rec) }; x.qtd += qty; x.total += qty * pu * mult; m.set(k, x); };
    const explode = (fonte, codigo, qty, mult, depth, fallback) => {
      if (depth > 10) return;
      if (fonte === 'PRÓPRIA'){ const p = Bases.propMap.get(ckey(codigo)); if (!p) return add(fonte, fallback, qty, mult);
        for (const i of p.itens) explode(fonteKey(i.fonte), i.codigo, qty * (+i.coef || 0), mult, depth + 1, { t:i.tipo, c:i.codigo, d:i.descricao, u:i.unidade }); return; }
      const b = Bases.data[ctx.bases[fonte]]; const r = b && Bases.find(b, codigo);
      if (!r){ return add(fonte, fallback, qty, mult); }
      if (r.t === 'I') return add(fonte, r, qty, mult);
      const comp = b.A.get(ckey(r.c));
      if (!comp || !comp.length){ semAnal++; return add(fonte, r, qty, mult); }
      for (const c of comp){ const rr = c.t === 'I' ? b.I.get(c.k) : b.C.get(c.k); if (rr) explode(fonte, rr.c, qty * c.coef, mult, depth + 1, rr); }
    };
    for (const it of Orc.doc.itens){ if (it.tipo !== 'item') continue;
      const mult = 1 + it._bdi;
      if (it.manual || it.fonte === 'MANUAL'){ const k = 'M|' + it.id; m.set(k, { fonte:it.fonteLabel || it.fonte, codigo:it.codigo, descricao:it.descricao, unidade:it.unidade, qtd:+it.qtd, pu:it._pu, total:it._tot, tipo:'Serviço (preço fixo)' }); continue; }
      explode(it.fonte, it.codigo, +it.qtd || 0, mult, 0, { t:'C', c:it.codigo, d:it.descricao, u:it.unidade }); }
    const res = this.classify([...m.values()].map(x => ({ ...x, total:r2(x.total) }))); res.semAnal = semAnal; return res;
  },
  classify(arr){
    arr.sort((a, b) => b.total - a.total); const tot = arr.reduce((s, x) => s + x.total, 0) || 1; let ac = 0;
    for (const x of arr){ x.pct = x.total / tot; const antes = ac; ac += x.pct; x.acum = ac; x.cls = antes < 0.8 ? 'A' : antes < 0.95 ? 'B' : 'C'; }
    arr.total = tot; return arr;
  },
  render(s){
    Orc.calc(); const d = this.modo === 'serv' ? this.servicos() : this.insumos();
    const cnt = { A:0, B:0, C:0 }, val = { A:0, B:0, C:0 }; d.forEach(x => { cnt[x.cls]++; val[x.cls] += x.total; });
    const anyA = Object.values(Orc.doc.bases).some(id => Bases.data[id]?.A.size);
    s.innerHTML = `<div class="row" style="margin-bottom:10px"><div class="subnav" style="margin:0;border:0"><button data-m="serv" class="${this.modo === 'serv' ? 'on' : ''}">Curva ABC de serviços</button><button data-m="ins" class="${this.modo === 'ins' ? 'on' : ''}">Curva ABC de insumos</button></div><div class="grow"></div>
      <button class="btn" id="abc-xls">Exportar Excel</button><button class="btn" id="abc-pdf">Imprimir / PDF</button></div>
      ${this.modo === 'ins' && d.semAnal ? `<div class="note" style="margin-bottom:10px">${d.semAnal} composição(ões) não têm analítico na base (ex.: ORSE ou bases importadas sem o analítico) e aparecem inteiras em vez de abertas em insumos.</div>` : ''}
      <div class="kpis" style="grid-template-columns:repeat(3,1fr)">${['A', 'B', 'C'].map(c => `<div class="kpi ${'abc' + c}"><span>Classe ${c} — ${cnt[c]} itens (${fp(cnt[c] / (d.length || 1))} dos itens)</span><b>R$ ${fm(val[c])} · ${fp(val[c] / d.total)}</b></div>`).join('')}</div>
      <div class="plan-wrap"><table class="t"><thead><tr><th>#</th><th>Fonte</th><th>Código</th><th>Descrição</th>${this.modo === 'ins' ? '<th>Tipo</th>' : ''}<th>Und</th><th class="n">Quant.</th><th class="n">Preço unit.</th><th class="n">Total</th><th class="n">%</th><th class="n">% acum.</th><th>Classe</th></tr></thead>
      <tbody>${d.map((x, i) => `<tr class="abc${x.cls}"><td>${i + 1}</td><td><span class="tag ${tagCls(x.fonte)}">${esc(x.fonte)}</span></td><td class="code">${esc(x.codigo)}</td><td>${esc(x.descricao)}</td>${this.modo === 'ins' ? `<td class="small">${esc(x.tipo || '')}</td>` : ''}<td>${esc(x.unidade)}</td><td class="n">${fq(r2(x.qtd * 10000) / 10000)}</td><td class="n">${fm(x.pu)}</td><td class="n">${fm(x.total)}</td><td class="n">${fp(x.pct)}</td><td class="n">${fp(x.acum)}</td><td><b>${x.cls}</b></td></tr>`).join('')}</tbody></table></div>`;
    $$('[data-m]', s).forEach(b => b.onclick = () => { this.modo = b.dataset.m; this.render(s); });
    $('#abc-xls').onclick = () => Rel.xlsABC(this.modo, d); $('#abc-pdf').onclick = () => Rel.printABC(this.modo, d);
  },
};
function tipoInsumo(r){ const d = norm(r.d), u = norm(r.u);
  if (/HORISTA|MENSALISTA/.test(d) || (/^(H|MES)$/.test(u) && /(PEDREIRO|SERVENTE|ELETRICISTA|ENCANADOR|PINTOR|CARPINTEIRO|ENGENHEIRO|MESTRE|AJUDANTE|OPERADOR|MONTADOR|ARMADOR)/.test(d))) return 'Mão de obra';
  if (/^(CHP|CHI)$/.test(u) || /DEPRECIA|LOCACAO|ALUGUEL/.test(d)) return 'Equipamento';
  return r.t === 'C' ? 'Composição (sem analítico)' : 'Material'; }

/* ---------- Cronograma ---------- */
const Crono = {
  etapas(){ return Orc.doc.itens.filter(i => i.tipo === 'etapa' && i.nivel === 1); },
  render(s){
    Orc.calc(); const c = Orc.doc.crono; const n = c.meses; const ets = this.etapas(); const tot = Orc.doc.resumo.total || 1;
    const mesV = Array(n).fill(0);
    const rows = ets.map(e => { const dist = (c.dist[e.id] ||= Array(n).fill(0)); dist.length = n; for (let i = 0; i < n; i++) dist[i] = +dist[i] || 0;
      const soma = dist.reduce((a, b) => a + b, 0); dist.forEach((p, i) => mesV[i] += e._tot * p / 100);
      return `<tr><td><b>${e.num}</b> ${esc(e.titulo)}</td><td class="n">${fm(e._tot)}</td><td class="n">${fp(e._tot / tot)}</td>

        <td class="n ${Math.abs(soma - 100) > 0.01 ? '' : ''}" style="color:${Math.abs(soma - 100) > 0.01 ? 'var(--red)' : 'var(--g7)'}"><b>${nf2.format(soma)}%</b></td><td><button class="btn sm" data-eq="${e.id}">Igual</button></td></tr>`; }).join('');
    let ac = 0; const acum = mesV.map(v => (ac += v));

      <button class="btn sm" id="cr-all">Distribuir todas igualmente</button><div class="grow"></div><button class="btn" id="cr-xls">Exportar Excel</button><button class="btn" id="cr-pdf">Imprimir / PDF</button></div>
      ${ets.length ? '' : '<div class="note">Crie etapas de nível 1 na planilha para montar o cronograma.</div>'}
      <div class="plan-wrap"><table class="t crono"><thead><tr><th>Etapa</th><th class="n">Valor</th><th class="n">Peso</th>${mesV.map((_, i) => `<th class="n">Mês ${i + 1} (%)</th>`).join('')}<th class="n">Soma</th><th></th></tr></thead>
      <tbody>${rows}</tbody><tfoot>
      <tr><td><b>Total do mês</b></td><td class="n"><b>${fm(tot)}</b></td><td></td>${mesV.map(v => `<td class="n"><b>${fm(v)}</b><div class="small mut">${fp(v / tot)}</div></td>`).join('')}<td></td><td></td></tr>
      <tr><td><b>Acumulado</b></td><td></td><td></td>${acum.map(v => `<td class="n">${fm(v)}<div class="bar"><i style="width:${Math.min(100, v / tot * 100)}%"></i></div><div class="small mut">${fp(v / tot)}</div></td>`).join('')}<td></td><td></td></tr></tfoot></table></div>`;
    $('#cr-n').onchange = e => { c.meses = Math.max(1, Math.min(48, +e.target.value || 1)); Orc.touch(); this.render(s); };
    $$('input[data-e]', s).forEach(i => i.onchange = () => { c.dist[i.dataset.e][+i.dataset.m] = parseNum(i.value) || 0; Orc.touch(); this.render(s); });
    const eq = id => { const v = Math.floor(10000 / n) / 100; c.dist[id] = Array(n).fill(v); c.dist[id][n - 1] = r2(100 - v * (n - 1)); };
    $$('[data-eq]', s).forEach(b => b.onclick = () => { eq(b.dataset.eq); Orc.touch(); this.render(s); });
    $('#cr-all').onclick = () => { ets.forEach(e => eq(e.id)); Orc.touch(); this.render(s); };

  },
};

const Obra = {
  _lista:null,
  async lista(force=false){

  nome(id){ return this._lista?.find(o => o.id === id)?.nome || ''; },
  // liga o orçamento à obra e completa os campos vazios com os dados dela
  async preencher(d, obraId){
    const o = (await this.lista()).find(x => x.id === obraId); if (!o) return;
    d.obra_id = o.id;
    if (!d.obra) d.obra = o.nome;
    if (!d.nome || d.nome === 'Novo orçamento') d.nome = o.nome;
    if (!d.endereco && o.endereco) d.endereco = o.endereco;
    if (!+d.desconto && o.desconto_pct != null) d.desconto = +o.desconto_pct;
  },
  // linhas no formato da função importar_planilha do banco
  linhas(){
    const d = Orc.doc, r = Orc.calc(), out = [], ordemDe = {}; let etapa = null;
    d.itens.forEach((it, i) => {
      const ordem = i + 1; ordemDe[it.id] = ordem;
      if (it.tipo === 'etapa'){ if (it.nivel === 1) etapa = ordem;
        out.push({ ordem, nivel:it.nivel, item:it.num, tipo:'etapa', descricao:it.titulo || '(etapa sem nome)', etapa_ordem:it.nivel === 1 ? null : etapa }); return; }
      out.push({ ordem, nivel:String(it.num).split('.').length, item:it.num, tipo:'servico', codigo:it.codigo || null, banco:it.fonteLabel || it.fonte || null,
        descricao:it.descricao || '(sem descrição)', unidade:it.unidade || null, quantidade:+it.qtd || 0, pu_sem_bdi:it._custo, pu_com_bdi:it._pu, etapa_ordem:etapa });
    });
    // a administração da obra do resumo vira um item, para o total da obra bater com o do orçamento
    if (r.adm > 0){
      const oe = out.length + 1, n1 = d.itens.filter(i => i.tipo === 'etapa' && i.nivel === 1).length + 1;
      out.push({ ordem:oe, nivel:1, item:String(n1), tipo:'etapa', descricao:'ADMINISTRAÇÃO DA OBRA', etapa_ordem:null });
      out.push({ ordem:oe + 1, nivel:2, item:n1 + '.1', tipo:'servico', codigo:null, banco:'PRÓPRIA', descricao:`ADMINISTRAÇÃO DA OBRA (${nf2.format(+d.adm || 0)}% SOBRE O CUSTO DIRETO)`,
        unidade:'UN', quantidade:1, pu_sem_bdi:r2(r.totalSem * (+d.adm || 0) / 100), pu_com_bdi:r.adm, etapa_ordem:oe });
    }
    return { itens:out, ordemDe };

  // cronograma do orçamento (% de cada mês, por etapa) → cronograma da obra (períodos de 30 dias)
  crono(ordemDe){

      for (let k = 0; k < n; k++){ const p = +dist[k] || 0; if (p > 0 && p <= 100) out.push({ etapa_ordem:ordemDe[e.id], periodo:k + 1, dias:30 * (k + 1), pct:p }); }

        if (tipo !== 'original') throw new Error('Uma obra nova começa pela planilha original.');
        const o = await Store.q(Store.sb.from('obras').insert({ nome:String(d.obra || d.nome || '').trim() || 'Obra sem nome', contratante:d.orgao || null,
          endereco:[d.endereco, d.municipio].filter(Boolean).join(' – ') || null, bdi_pct:bdi, desconto_pct:+d.desconto || 0, fonte_precos:fonte, data_base:dataBase }).select('id').single());
        obraId = o.id;
      }
      const { itens, ordemDe } = this.linhas();
      const cronograma = tipo === 'original' ? this.crono(ordemDe) : [];
      msg('Gravando…');
      const res = await Store.q(Store.sb.rpc('importar_planilha', { p_obra_id:obraId, p_tipo:tipo, p_numero:numero, p_itens:itens, p_cronograma:cronograma,
        p_descricao:(tipo === 'original' ? 'Planilha original' : `Aditivo ${numero}`) + ` (orçamento ${d.nome})`, p_data:d.data || null }));
      if (tipo === 'original' && obraSel !== '__nova'){
        // completa BDI, desconto e bases da obra sem apagar o que já estiver preenchido
        const o = await Store.q(Store.sb.from('obras').select('bdi_pct,desconto_pct,fonte_precos,data_base').eq('id', obraId).single());
        const upd = {};
        if (o.bdi_pct == null) upd.bdi_pct = bdi;
        if (o.desconto_pct == null || +o.desconto_pct === 0) upd.desconto_pct = +d.desconto || 0;
        if (!o.fonte_precos) upd.fonte_precos = fonte;
        if (!o.data_base && dataBase) upd.data_base = dataBase;
        if (Object.keys(upd).length) await Store.q(Store.sb.from('obras').update(upd).eq('id', obraId));
      }
      d.obra_id = obraId; d.gravadoNaObra = { em:new Date().toISOString(), tipo, numero };
      await this.lista(true); await Orc.save(true);
      msg(`<span style="color:var(--verde)">✓ Gravado: ${res.itens} linhas${res.cronograma ? ` e ${res.cronograma} períodos do cronograma` : ''}.</span> <a href="../obras/obra.html?id=${obraId}">Abrir a obra →</a>`);
      ok.textContent = 'Gravado'; ok.dataset.confirmar = '';
    } catch(e){ msg(`<span style="color:var(--red)">Erro: ${esc(e.message)}</span>`); ok.disabled = false; }
  },
};

/* ---------- Relatórios (modelo PASSAREDO) ---------- */
function extenso(v){
  const U = ['', 'UM', 'DOIS', 'TRÊS', 'QUATRO', 'CINCO', 'SEIS', 'SETE', 'OITO', 'NOVE', 'DEZ', 'ONZE', 'DOZE', 'TREZE', 'QUATORZE', 'QUINZE', 'DEZESSEIS', 'DEZESSETE', 'DEZOITO', 'DEZENOVE'];
  const D = ['', '', 'VINTE', 'TRINTA', 'QUARENTA', 'CINQUENTA', 'SESSENTA', 'SETENTA', 'OITENTA', 'NOVENTA'];
  const C = ['', 'CENTO', 'DUZENTOS', 'TREZENTOS', 'QUATROCENTOS', 'QUINHENTOS', 'SEISCENTOS', 'SETECENTOS', 'OITOCENTOS', 'NOVECENTOS'];
  const ate999 = n => { if (n === 100) return 'CEM'; const c = Math.floor(n / 100), r = n % 100, p = [];
    if (c) p.push(C[c]); if (r < 20){ if (r) p.push(U[r]); } else { p.push(D[Math.floor(r / 10)] + (r % 10 ? ' E ' + U[r % 10] : '')); } return p.join(' E '); };
  const inteiro = n => { if (n === 0) return 'ZERO'; const grupos = []; while (n > 0){ grupos.push(n % 1000); n = Math.floor(n / 1000); }
    const nomes = [['', ''], ['MIL', 'MIL'], ['MILHÃO', 'MILHÕES'], ['BILHÃO', 'BILHÕES']]; const partes = [];
    for (let i = grupos.length - 1; i >= 0; i--){ const g = grupos[i]; if (!g) continue;
      let t = (i === 1 && g === 1) ? 'MIL' : ate999(g) + (i ? ' ' + nomes[i][g > 1 ? 1 : 0] : ''); partes.push({ t, g, i }); }
    return partes.map((p, k) => { if (k === 0) return p.t; const last = k === partes.length - 1; return ((last && (p.g < 100 || p.g % 100 === 0)) ? ' E ' : ', ') + p.t; }).join(''); };
  v = Math.round((+v || 0) * 100); const re = Math.floor(v / 100), ce = v % 100;
  let s = ''; if (re) s = inteiro(re) + (re % 1000000 === 0 ? ' DE' : '') + (re === 1 ? ' REAL' : ' REAIS');
  if (ce) s += (s ? ' E ' : '') + inteiro(ce) + (ce === 1 ? ' CENTAVO' : ' CENTAVOS');
  return s || 'ZERO REAIS';
}

function grupoComp(i){ const d = norm(i.descricao), u = norm(i.unidade);
  if (i.tipo === 'C'){ if (/ENCARGOS COMPLEMENTARES/.test(d)) return 'Mão de Obra com Encargos Complementares'; if (/^(CHP|CHI)$/.test(u)) return 'Equipamento Custo Horário'; return 'Composições Auxiliares'; }
  const t = tipoInsumo({ d:i.descricao, u:i.unidade, t:'I' }); return t === 'Mão de obra' ? 'Mão de Obra' : t; }
