/* =================== IMPORTAÇÃO =================== */
const Importer = {
  pick(accept, cb){ const fi = $('#file-in'); fi.value = ''; fi.accept = accept; fi.onchange = () => fi.files[0] && cb(fi.files[0]); fi.click(); },
  async readBook(file){ if (!window.XLSX) throw new Error('Biblioteca do Excel não carregou'); const buf = await file.arrayBuffer(); return XLSX.read(buf, { type:'array' }); },
  aoa(wb, name){ return XLSX.utils.sheet_to_json(wb.Sheets[name], { header:1, raw:true, defval:null, blankrows:false }); },
  /* ---- orçamento (formato OrçaFascio / similar) ---- */
  pickOrc(){ this.pick('.xlsx,.xls,.csv', f => this.importOrc(f).catch(e => toast('Erro: ' + e.message, 6000))); },
  async importOrc(file){
    const wb = await this.readBook(file); let rows = null, hi = -1;
    await Bases.ensure(Bases.padrao('SINAPI'));
    const isHdr = r => r && r.some(c => /^I?TEM$/.test(norm(c).trim())) && r.some(c => /DESCRI/.test(norm(c))) && r.some(c => /QUANT/.test(norm(c)));
    const cand = [...wb.SheetNames].sort((a, b) => (/PLAN|ORCAMENT/.test(norm(b)) ? 1 : 0) - (/PLAN|ORCAMENT/.test(norm(a)) ? 1 : 0));
    for (const sn of cand){ const rr = this.aoa(wb, sn); const h = rr.findIndex(isHdr); if (h >= 0){ rows = rr; hi = h; break; } }
    if (hi < 0) throw new Error('Não encontrei a linha de cabeçalho (ITEM / DESCRIÇÃO / QUANT.) em nenhuma aba');
    const H = rows[hi].map(c => norm(c).replace(/\s+/g, ' ').trim());
    const col = re => H.findIndex(h => re.test(h));
    const C = { item:col(/^I?TEM$/), cod:col(/CODIGO/), desc:col(/DESCRI/), fonte:col(/FONTE|BANCO/), und:col(/^UN/), qtd:col(/QUANT/), psb:col(/S\/ ?BDI|SEM BDI/), pu:col(/UNITARIO|UNIT/), tot:col(/TOTAL/) };
    if (C.psb >= 0) C.pu = C.psb;
    let bdiTot = null, orcTot = null, bdiCel = null, descPct = 0;
    const desFile = rows.slice(0, hi + 1).some(r => r.some(c => /COM DESONERA/.test(norm(c))));
    const refCel = rows.slice(0, hi).flat().find(c => /REF\.?:/.test(norm(c)) && /SINAPI|ORSE|TABELA/.test(norm(c)));
    for (const r of rows.slice(0, hi)){ const k = r.findIndex(c => /^BDI:?$/.test(norm(c).trim())); if (k >= 0){ const v = r.slice(k + 1).find(c => typeof c === 'number'); if (v != null) bdiCel = v; } }
    for (const r of rows.slice(hi + 1)){ const t = r.map(c => norm(c)).join('|'); const val = r.filter(c => typeof c === 'number').pop();
      if (/VALOR BDI/.test(t)) bdiTot = val; else if (/VALOR ORCAMENTO|VALOR SEM BDI|CUSTO DIRETO/.test(t)) orcTot = val;
      else if (/DESCONTO/.test(t)){ const p = r.filter(c => typeof c === 'number' && c > 0 && c < 1)[0]; if (p) descPct = r2(p * 100); } }
    const precoSemBdi = C.psb >= 0; const bdiDet = precoSemBdi ? 0 : (bdiTot && orcTot ? bdiTot / orcTot : 0);
    const bdiAdot = bdiCel != null ? (bdiCel > 1 ? bdiCel / 100 : bdiCel) : (precoSemBdi ? 0 : bdiDet);
    const d = novoOrc(); d.nome = file.name.replace(/\.[^.]+$/, ''); let nI = 0;
    const { comps:compsArq, sheet:compSheet } = this.compsFromBook(wb);
    for (const r of rows.slice(hi + 1)){
      const item = r[C.item] == null ? '' : String(r[C.item]).trim(); const desc = String(r[C.desc] ?? '').trim();
      const fonte = C.fonte >= 0 ? String(r[C.fonte] ?? '').trim() : ''; const cod = C.cod >= 0 ? String(r[C.cod] ?? '').trim() : '';
      if (/^VALOR/.test(norm(item))) continue;
      if (!item && !(fonte && desc && String(r[C.qtd] ?? '').trim() !== '')) continue;
      if (!fonte && !(C.qtd >= 0 && String(r[C.qtd] ?? '').trim() !== '' && cod)){
        const tit = desc || r.slice(C.item + 1).find(c => typeof c === 'string' && c.trim() && isNaN(parseNum(c)));
        if (tit) d.itens.push({ id:uid(), tipo:'etapa', nivel:Math.min(3, String(item || '1').split('.').length), titulo:String(tit).trim().toUpperCase() }); continue; }
      if (!desc) continue;
      const fk = fonteKey(fonte) || 'MANUAL'; const pu = parseNum(r[C.pu]);
      d.itens.push({ id:uid(), tipo:'item', fonte:fk, fonteLabel:fk === 'PRÓPRIA' ? 'PRÓPRIA' : undefined, codigo:cod, descricao:desc, unidade:String(r[C.und] ?? '').trim().toUpperCase(), qtd:parseNum(r[C.qtd]) || 0, qexpr:'', custo:isNaN(pu) ? 0 : pu, puArq:pu, manual:true, importado:true, bdiDif:false });
      nI++;
    }
    UI.modal(`<h2>Importar orçamento</h2><p><b>${esc(file.name)}</b>: ${d.itens.length - nI} etapas e ${nI} itens encontrados.</p>
      <p class="small mut">A taxa de administração da obra começa em 0% no orçamento importado (a planilha original já traz a administração local como item). Ajuste em Dados e BDI se precisar.</p><div class="grid g2"><div><label class="l">Nome do orçamento</label><input class="f" id="io-n" value="${esc(d.nome)}"></div>
      <div><label class="l">BDI embutido nos preços do arquivo (%)</label><input class="f" id="io-b" value="${nf2.format(bdiDet * 100)}"><div class="small mut">${precoSemBdi ? 'A planilha tem a coluna “PREÇO S/BDI”: os custos entram sem BDI.' : bdiDet ? 'Calculado pelo “Valor BDI / Valor orçamento” do rodapé.' : 'Não encontrei no rodapé; informe se os preços do arquivo já têm BDI.'}</div></div>
      <div><label class="l">BDI do orçamento (%)</label><input class="f" id="io-ba" value="${nf2.format(bdiAdot * 100)}"></div><div><label class="l">Desconto (%)</label><input class="f" id="io-d" value="${nf2.format(descPct)}"></div></div>
      <div style="margin-top:12px"><label class="chk"><input type="checkbox" id="io-ref"> <b>Guardar como orçamento de referência</b> (modelo; mantém os preços originais da planilha)</label>
      ${compsArq.length ? `<label class="chk" style="margin-top:6px"><input type="checkbox" id="io-cp" checked> Importar também as <b>${compsArq.length} composições próprias</b> da aba ${esc(compSheet)} (${compsArq.map(c => esc(c.codigo)).join(', ')})</label>` : ''}</div>
      <div style="margin-top:12px"><label class="chk"><input type="radio" name="io-m" value="base" checked> Usar os preços da base atual (${esc(Bases.meta(d.bases.SINAPI)?.desc || 'SINAPI')}) nos itens encontrados; os demais mantêm o preço do arquivo</label>
      <label class="chk" style="margin-top:6px"><input type="radio" name="io-m" value="arq"> Manter todos os preços do arquivo (preço fixo)</label></div>
      <div class="ft"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn pri" id="io-ok">Importar</button></div>`);
    $('#io-n').oninput = e => e.target.dataset.edited = '1';
    $('#io-ref').onchange = e => { if (e.target.checked) $('input[name=io-m][value=arq]').checked = true; };
    $('#io-ok').onclick = async () => {
      const bdi = (parseNum($('#io-b').value) || 0) / 100; const usaBase = $$('input[name=io-m]').find(x => x.checked).value === 'base';
      d.referencia = $('#io-ref').checked; let nCp = 0; if (refCel) d.refTexto = String(refCel).replace(/^\s*REF\.?:\s*/i, '').trim();
      if (compsArq.length && $('#io-cp')?.checked){ $('#io-ok').disabled = true; $('#io-ok').textContent = 'Importando composições…';
        try { nCp = await this.saveComps(compsArq, d.nome); } catch(e){ toast('Erro ao salvar composições: ' + e.message, 6000); } }
      d.nome = $('#io-n').value.trim() || d.nome; d.obra = d.nome; d.adm = 0; d.desconto = parseNum($('#io-d').value) || 0; if (desFile) d.des = true;
      const ba = parseNum($('#io-ba').value); if (ba > 0){ d.bdi.fixoOn = true; d.bdi.fixo = r2(ba); }
      for (const [lab, key] of [['OBRA', 'obra'], ['ENDERECO', 'endereco'], ['MUNICIPIO', 'municipio'], ['ASSUNTO', 'assunto'], ['ORDEM DE SERVICO', 'os']]){
        for (const r of rows.slice(0, hi)){ const k = r.findIndex(c => norm(c).trim().replace(/:$/, '') === lab); if (k >= 0){ const v = r.slice(k + 1).find(c => c != null && String(c).trim()); if (v) d[key] = String(v).trim(); } } }
      if (d.obra && d.obra !== d.nome && !$('#io-n').dataset.edited) d.nome = d.obra;
      let found = 0, nf = 0; const ctx = { bases:d.bases, des:d.des };
      for (const it of d.itens){ if (it.tipo !== 'item') continue; it.custo = (it.puArq || 0) / (1 + bdi); delete it.puArq;
        if (usaBase){ const u = Bases.unitCost(it.fonte, it.codigo, ctx); if (u.price != null){ it.manual = false; it.importado = false; found++; } else nf++; } }
      UI.closeModal(); await Store.saveOrc({ id:d.id, nome:d.nome, dados:d }); await Orc.open(d.id); Orc.calc(); await Orc.save(true);
      toast((usaBase ? `Importado: ${found} itens com preço da base, ${nf} com preço do arquivo` : 'Importado com os preços do arquivo') + (nCp ? ` · ${nCp} composições próprias salvas` : ''), 6000); UI.sub = 'plan'; UI.go('orc');
    };
  },
  /* ---- composições próprias de uma aba no formato “Relatório de Composições” (PASSAREDO) ---- */
  compsFromBook(wb){
    const sn = wb.SheetNames.find(n => /^COMPOSI/.test(norm(n).trim())); if (!sn) return { comps:[], sheet:null };
    const rows = this.aoa(wb, sn), out = []; let cur = null; const sb = Bases.data[Bases.padrao('SINAPI')];
    for (const r of rows){ const [a, b, c, dd, e, f] = r; const A = String(a ?? '').trim(), B = String(b ?? '').trim();
      if (/^COMP/i.test(A) && B && !String(c ?? '').trim()){ cur = { codigo:A, descricao:B.replace(/\s*\(([A-Z0-9²³]+)\)\s*$/, ''), unidade:(B.match(/\(([A-Z0-9²³]{1,6})\)\s*$/) || [, 'UN'])[1], obs:'', itens:[] }; out.push(cur); continue; }
      if (!cur) continue;
      if (norm(c).trim() === 'FONTE') continue;
      if (B.startsWith('*')){ cur.obs = B.slice(1).trim(); continue; }
      if (A && B && String(c ?? '').trim() && typeof e === 'number'){
        const fonte = fonteKey(c) === 'PROPRIO' ? 'PRÓPRIA' : fonteKey(c);
        const tipo = fonte === 'SINAPI' && sb ? (sb.C.get(ckey(A)) ? 'C' : 'I') : (/ENCARGOS|^COMP/i.test(B + A) ? 'C' : 'I');
        cur.itens.push({ fonte, tipo, codigo:A, descricao:B, unidade:String(dd ?? '').trim(), coef:e, preco:typeof f === 'number' ? f : parseNum(f) });
      } }
    return { comps:out, sheet:sn };
  },
  async saveComps(comps, origem){
    let n = 0; const usados = new Set(Bases.props.map(p => ckey(p.codigo)));
    for (const c of comps){
      const igual = Bases.props.find(p => ckey(p.codigo) === ckey(c.codigo) && norm(p.descricao) === norm(c.descricao)); if (igual) continue;
      let cod = c.codigo, k = 2; while (usados.has(ckey(cod))) cod = `${c.codigo}-${k++}`; usados.add(ckey(cod));
      await Store.saveProp({ id:uid(), codigo:cod, descricao:c.descricao.toUpperCase(), unidade:c.unidade, grupo:'Importada de ' + origem, obs:c.obs, itens:c.itens }); n++;
    }
    await Bases.reloadProps(); return n;
  },
  /* ---- base de preços ---- */
  pickBase(modo){ this.pick('.xlsx,.xls,.csv', f => this.mapBase(f, modo).catch(e => toast('Erro: ' + e.message, 6000))); },
  async mapBase(file, modo){
    const wb = await this.readBook(file); const st = { wb, sheet:wb.SheetNames[0], hdr:1, modo, file };
    this.st = st; this.mapUI();
  },
  mapUI(){
    const st = this.st, rows = this.aoa(st.wb, st.sheet); st.rows = rows;
    const hdr = rows[st.hdr - 1] || []; const ncol = Math.max(...rows.slice(0, 40).map(r => r.length), 0);
    const L = i => XLSX.utils.encode_col(i); const opt = sel => `<option value="-1">—</option>` + Array.from({ length:ncol }, (_, i) => `<option value="${i}" ${sel === i ? 'selected' : ''}>${L(i)}: ${esc(String(hdr[i] ?? '').slice(0, 40))}</option>`).join('');
    const guess = re => hdr.findIndex(h => re.test(norm(h)));
    st.map ||= {};
    const fields = st.modo === 'itens' ? [['codigo', 'Código *', /CODIGO/], ['descricao', 'Descrição *', /DESCRI/], ['unidade', 'Unidade', /^UN/], ['preco_nd', 'Preço/custo não desonerado *', /(NAO DESON|SEM DESON|PRECO|CUSTO)/], ['preco_d', 'Preço/custo desonerado', /(^|[^O] )DESON|COM DESON/], ['tipo', 'Coluna de tipo (insumo/composição)', /^TIPO|CLASSE/], ['grupo', 'Grupo / classe', /GRUPO/]]
      : [['comp', 'Código da composição *', /COMPOSI|CODIGO/], ['tipo', 'Tipo do item (INSUMO/COMPOSICAO) *', /TIPO/], ['item', 'Código do item *', /ITEM|INSUMO/], ['coef', 'Coeficiente *', /COEF/]];
    for (const [k, , re] of fields) if (st.map[k] == null) st.map[k] = guess(re);
    UI.modal(`<h2>${st.modo === 'itens' ? 'Importar base de preços' : 'Importar analítico de composições'}</h2>
      <div class="grid g3"><div><label class="l">Planilha (aba)</label><select class="f" id="mp-s">${st.wb.SheetNames.map(s => `<option ${s === st.sheet ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
      <div><label class="l">Linha do cabeçalho</label><input class="f" id="mp-h" type="number" min="1" value="${st.hdr}"></div><div class="small mut" style="align-self:end">${rows.length} linhas na aba. Os dados começam na linha seguinte ao cabeçalho.</div></div>
      <h3>Base</h3>${st.modo === 'itens' ? `<div class="grid g4"><div><label class="l">Fonte *</label><input class="f" id="mp-f" value="${esc(st.fonte || (/ORSE/i.test(st.file.name) ? 'ORSE' : /SINAPI/i.test(st.file.name) ? 'SINAPI' : ''))}" placeholder="ORSE, SINAPI, SEINFRA…"></div>
        <div><label class="l">UF / localidade</label><input class="f" id="mp-uf" value="${esc(st.uf || (/ORSE/i.test(st.file.name) ? 'SE' : 'MT'))}"></div><div><label class="l">Mês de referência *</label><input class="f" id="mp-r" type="month" value="${esc(st.ref || '')}"></div>
        <div><label class="l">Tipo padrão dos itens</label><select class="f" id="mp-t"><option value="C" ${st.tdef === 'C' ? 'selected' : ''}>Composição / serviço</option><option value="I" ${st.tdef === 'I' ? 'selected' : ''}>Insumo</option></select></div></div>
        <div class="small mut" style="margin-top:6px">Se importar insumos e composições em duas vezes (abas diferentes), use a mesma fonte, UF e mês: os itens são somados na mesma base.</div>`
      : `<div><label class="l">Base que receberá o analítico</label><select class="f" id="mp-b">${Bases.list.filter(b => !b.embedded && b.dono === Store.user?.id).map(b => `<option value="${b.id}">${esc(b.desc || b.id)}</option>`).join('')}</select></div>`}
      <h3>Colunas</h3><div class="grid g4">${fields.map(([k, lab]) => `<div><label class="l">${lab}</label><select class="f" data-mp="${k}">${opt(st.map[k])}</select></div>`).join('')}</div>
      <h3>Prévia</h3><div style="overflow:auto;max-height:240px;border:1px solid var(--line);border-radius:6px"><table class="t small"><tbody>${rows.slice(Math.max(0, st.hdr - 1), st.hdr + 12).map((r, i) => `<tr style="${i === 0 ? 'font-weight:700;background:var(--th)' : ''}"><td class="mut">${st.hdr + i}</td>${Array.from({ length:Math.min(ncol, 14) }, (_, j) => `<td>${esc(String(r[j] ?? '').slice(0, 50))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div id="mp-prog" class="small mut" style="margin-top:8px"></div>
      <div class="ft"><button class="btn" onclick="UI.closeModal()">Cancelar</button><button class="btn pri" id="mp-ok">Importar</button></div>`, true);
    const keep = () => { st.fonte = $('#mp-f')?.value; st.uf = $('#mp-uf')?.value; st.ref = $('#mp-r')?.value; st.tdef = $('#mp-t')?.value; $$('[data-mp]').forEach(s => st.map[s.dataset.mp] = +s.value); };
    $('#mp-s').onchange = e => { keep(); st.sheet = e.target.value; st.map = {}; this.mapUI(); };
    $('#mp-h').onchange = e => { keep(); st.hdr = Math.max(1, +e.target.value || 1); st.map = {}; this.mapUI(); };
    $('#mp-ok').onclick = () => { keep(); this.run().catch(e => { $('#mp-prog').textContent = 'Erro: ' + e.message; }); };
  },
  async run(){
    const st = this.st, m = st.map, rows = st.rows.slice(st.hdr); const prog = $('#mp-prog'); $('#mp-ok').disabled = true;
    const cell = (r, k) => m[k] >= 0 ? r[m[k]] : null;
    if (st.modo === 'itens'){
      if (!st.fonte || !st.ref || m.codigo < 0 || m.descricao < 0 || m.preco_nd < 0){ $('#mp-ok').disabled = false; return toast('Preencha os campos com *'); }
      const fonte = fonteKey(st.fonte); let id = `${fonte}-${(st.uf || '').toUpperCase()}-${st.ref}`;
      if (Bases.meta(id)?.embedded) id += '-IMPORTADA';   // não colide com a base pronta do mesmo mês
      let itens = new Map(); const exist = Bases.list.find(b => b.id === id);
      if (exist && !exist.embedded && exist.dono && exist.dono !== Store.user?.id){ $('#mp-ok').disabled = false; return toast('Esta base foi importada por outro usuário; só quem importou pode alterá-la.', 6000); }
      if (exist && !exist.embedded){ const cur = await Store.loadBaseItems(id); for (const x of cur.itens) itens.set(x.tipo + '|' + x.codigo, x); }
      let n = 0;
      for (const r of rows){ const c = cell(r, 'codigo'); const d = cell(r, 'descricao'); if (c == null || d == null || String(c).trim() === '') continue;
        const tcol = norm(cell(r, 'tipo')); const tipo = tcol ? (/INSUMO|MATERIAL|MAO|EQUIP/.test(tcol) ? 'I' : 'C') : st.tdef;
        const pnd = parseNum(cell(r, 'preco_nd')), pd = parseNum(cell(r, 'preco_d'));
        const codigo = String(c).trim();
        itens.set(tipo + '|' + codigo, { tipo, codigo, descricao:String(d).trim(), unidade:String(cell(r, 'unidade') ?? '').trim(), grupo:m.grupo >= 0 ? String(cell(r, 'grupo') ?? '').trim() || null : null, preco_nd:isNaN(pnd) ? null : pnd, preco_d:isNaN(pd) ? (isNaN(pnd) ? null : pnd) : pd, extra:null }); n++; }
      if (!n){ $('#mp-ok').disabled = false; return toast('Nenhuma linha válida — confira a linha do cabeçalho e as colunas'); }
      const arr = [...itens.values()]; const meta = { id, fonte, uf:(st.uf || '').toUpperCase(), referencia:st.ref, descricao:`${fonte} ${(st.uf || '').toUpperCase()} ${refBR(st.ref)}`, meta:{ nI:arr.filter(x => x.tipo === 'I').length, nC:arr.filter(x => x.tipo === 'C').length } };
      await Store.saveBase(meta, arr, null, (a, t) => prog.textContent = `Enviando ${a} de ${t}…`);
      Bases.list = Bases.list.filter(b => b.id !== id); Bases.list.push({ id, fonte, uf:meta.uf, ref:st.ref, desc:meta.descricao, nI:meta.meta.nI, nC:meta.meta.nC, dono:Store.user?.id }); delete Bases.data[id];
      UI.closeModal(); toast(`Base ${meta.descricao} importada: ${n} linhas`, 5000); BasesUI.cur = null; UI.go('bases');
    } else {
      if (['comp', 'tipo', 'item', 'coef'].some(k => m[k] < 0)){ $('#mp-ok').disabled = false; return toast('Preencha os campos com *'); }
      const bid = $('#mp-b').value; const anal = [];
      if (!bid){ $('#mp-ok').disabled = false; return toast('Escolha a base que receberá o analítico'); }
      for (const r of rows){ const c = cell(r, 'comp'), it = cell(r, 'item'), coef = parseNum(cell(r, 'coef')); if (c == null || it == null || isNaN(coef)) continue;
        anal.push({ comp_codigo:String(c).trim(), item_tipo:/INSUMO|MATERIAL|MAO|EQUIP/.test(norm(cell(r, 'tipo'))) ? 'I' : 'C', item_codigo:String(it).trim(), coef }); }
      if (!anal.length){ $('#mp-ok').disabled = false; return toast('Nenhuma linha válida'); }
      const bm = Bases.meta(bid); const meta = { id:bid, fonte:bm.fonte, uf:bm.uf, referencia:bm.ref, descricao:bm.desc, meta:{ nI:bm.nI, nC:bm.nC, nA:anal.length } };
      await Store.saveBase(meta, null, anal, (a, t) => prog.textContent = `Enviando ${a} de ${t}…`);
      const b = Bases.data[bid]; if (b){ b.A = new Map(); for (const a of anal){ const k = ckey(a.comp_codigo); if (!b.A.has(k)) b.A.set(k, []); b.A.get(k).push({ t:a.item_tipo, k:ckey(a.item_codigo), coef:a.coef }); } }
      bm.hasA = true; UI.closeModal(); toast(`Analítico importado: ${anal.length} linhas`, 5000); UI.go('bases');
    }
  },
};

/* =================== INÍCIO =================== */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if ($('#modal-bg').classList.contains('open')) UI.closeModal(); else UI.closeDrawer(); }
  // itens clicáveis da lista também abrem pelo teclado (Enter ou espaço)
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][tabindex]')){ e.preventDefault(); e.target.click(); return; }
  if (UI.view === 'orc' && UI.sub === 'plan' && !e.target.matches('input,textarea,select')){
    if (e.key === 'Delete') $('#t-del')?.click();
    if (e.key === 'Insert' || (e.key === 'i' && (e.ctrlKey || e.metaKey))){ e.preventDefault(); $('#t-add')?.click(); }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's' && UI.view === 'orc'){ e.preventDefault(); Orc.save(); }
});
$('#modal-bg').addEventListener('mousedown', e => { if (e.target.id === 'modal-bg') UI.closeModal(); });
$$('#nav button').forEach(b => b.onclick = async () => { if (UI.view === 'orc' && Orc.dirty) await Orc.save(); UI.go(b.dataset.v); });
window.addEventListener('beforeunload', e => { if (Orc.dirty){ Orc.save(); e.preventDefault(); e.returnValue = ''; } });
(async () => {
  $('#view').innerHTML = '<div class="empty">Carregando…</div>';
  if (!(await Store.init())) return;           // sem login: SE.exigirLogin já mandou para a tela de entrada
  await Bases.init();
  const sin = Bases.padrao('SINAPI'); Prop.ctx = { bases: sin ? { SINAPI:sin } : {}, des:false };
  // links vindos do sistema: ?id=<orçamento> abre direto; ?obra=<obra> lista e cria orçamentos daquela obra
  const P = new URLSearchParams(location.search), abrir = P.get('id'), obra = P.get('obra');
  try { const l = await Obra.lista(); if (obra){ const o = l.find(x => x.id === obra); if (o) UI.obraFiltro = { id:o.id, nome:o.nome }; } } catch(e){ console.warn(e); }
  if (abrir){ try { await Orc.open(abrir); UI.sub = 'plan'; UI.go('orc'); return; } catch(e){ toast('Não consegui abrir o orçamento: ' + e.message, 6000); } }
  UI.go('orcs');
})();
</script>
</body>
